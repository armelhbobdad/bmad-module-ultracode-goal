type: added
scope: ultracode-goal
summary: |
  New `--artifacts-root DIR` for `claim_check.py`, repeatable. A path the texts name that does not exist from the project root but exists under one of those folders is read there: it lands in `ignored` when each copy that holds it is either ignored by git or outside the work tree, and stays in `not_in_diff` otherwise, a tracked copy included. Execute's pre-commit claim check now passes the run folder, the story's `.scratch-<story_id>/` and its `evidence-<story_id>/`, so a git-ignored artifact the story record names from its own folder (`sweep.sh`, `red-phase/INDEX.md`) is listed in `ignored` rather than `not_in_diff`, where such names had buried the few tracked files a record names on purpose. A name that exists from the project root, that a file the index or the work tree holds anywhere in the work tree could be (by its trailing segments, its first folder as a folder of such a path, or a first segment that exists from the project root or the top level), or that exists under none of the folders is read as before, and with no `--artifacts-root` the output is unchanged. A file the commit claims and never wrote, named bare, under a folder the tree does not hold, or under an empty or ignored-only folder inside an untracked one, reads as a same-named copy in one of the folders, so Execute's search for the hunk of each edit the texts claim is what catches it. A path under the story's scratch or evidence folder is never staged: the record names it on purpose.
