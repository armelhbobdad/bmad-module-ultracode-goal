type: fixed
scope: ultracode-goal
summary: |
  A resume now holds a run in flight to the `Claude Code` 2.1.295 that UCG requires. `preflight_check.py --assert-armed` runs `claude --version`, with the `claude` first on `PATH` as the fresh preflight does, and fails below any minimum the fresh preflight's `cc_version` blocker enforces, reporting `checks.cc_version` and a reason that opens with that blocker's words. Before, a resume never read the version, so a run on an older Claude Code re-armed the guard with `"onFailure": "block"`, which that version ignores, and the assertion passed. A resume cannot update Claude Code, so it escalates the story it was about to drive, before it fixes any other reason the assertion names, and the escalation quotes each reason that is the operator's to fix: update Claude Code, then, in a new session, close that escalation with `/ucg-resolve`, which an attended resume offers. The assertion's `reasons` list that reason, and a missing story skill's, ahead of every other, each saying to escalate before fixing any other, and a hooks reason now says its re-merge waits for the resume after the operator's fix. A version `claude --version` cannot give is reported with `read: false` and fails nothing.
