type: breaking
scope: ultracode-goal, ucg-formalize
summary: |
  The readiness check (`formalize_check.py`), which preflight and `/ucg-formalize` run, now reads TEA's output for the Epic it checks, where TEA writes it. It used to search the TEA config's `trace_output` folder, which TEA 1.27.2 does not write to, so on the config the TEA installer writes it read no test-design at all, and on a config that names neither key it searched no folder; where it did search one, it took the first file whose name held `test-design`, whatever Epic that file belonged to. It now searches TEA's test-artifacts root as preflight resolves it (the config's `test_artifacts` value, or `_bmad-output/test-artifacts` when the config names none or does not exist), in that folder and every folder below it, and reads every copy of the checked Epic's own `test-design-epic-<epic>.md`. Another Epic's test-design, TEA's system-level `test-design-architecture.md` and `test-design-qa.md`, and TEA's progress, validation and handoff files no longer raise a gap or a judgment candidate, and the Epic's own test-design is no longer skipped when one of them sorts first. The risk-matrix check now reads TEA's own `Probability` and `Impact` column headers, a bold or backticked cell, and each table under its own header row (a row without its outer pipes stays in its table), so a blank Score cell and a stated score that disagrees with Probability times Impact are reported in the tables TEA writes, and another table's numbers are no longer read as risk scores. A missing `nfr-assessment.md` is no longer a gap, so the check no longer reports `missing_nfr_assessment`: TEA assesses NFRs from implementation evidence, after preflight, and the production gate still requires an assessment for each story. An `nfr-assessment.md` is read only beside the Epic's test-design, and only when its `**Story:**` or `story_id:` line names a story the check reads, so another Epic's assessment raises nothing; one beside the Epic's test-design that cannot be read is a failing `unreadable_tea_artifact` gap, as an unreadable test-design is. A TEA file under the test-artifacts root, or under a `trace_output` folder the config sets, is not a leaked TEA artifact. An Epic that another Epic's test-design used to stop on `missing_nfr_assessment` now launches. An Epic whose own test-design is under that root gets these checks for the first time, so `/ucg-formalize -H` can return `status=blocked` and preflight can stop where it launched before.
migration: |
  If preflight or `/ucg-formalize` now stops on the Epic's `test-design-epic-<epic>.md`, fix that file and run preflight again: make each stated Score equal Probability times Impact, or run `bmad-testarch-test-design` for the Epic again; cite the source of each NFR threshold or mark it `UNKNOWN`; save it, and an `nfr-assessment.md` beside it, as UTF-8. When a flagged value is right as it stands, clear it in preflight's judgment pass, or answer its RED with `/ucg-resolve`. A blank Score cell needs nothing: preflight's remediation pass writes the score the gap carries.
