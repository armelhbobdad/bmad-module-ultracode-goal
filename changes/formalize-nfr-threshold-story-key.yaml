type: fixed
scope: ultracode-goal, ucg-formalize
summary: |
  The readiness check behind `/ucg-formalize` and preflight no longer reads a story key whose story number carries letters as an NFR threshold. A line naming a row such as `61-1s-sample-story`, by its key, by its stem `61-1s` or by a file named after it such as `atdd-checklist-61-1s-sample-story.md`, read the `1s` as one second, so every such line in a story's acceptance criteria or in the Epic's `test-design-epic-<N>.md` raised an `invented_nfr_threshold` candidate that remediation could never clear, and the verdict stayed `blocked` until the judgment pass cleared each one. Before it looks for a number with a unit, `formalize_check.py` now leaves out every `sprint-status.yaml` key, of any Epic, whose story number carries letters (`1s`, `2ms`, `1.5s`) and that has more than its Epic and story number, also inside a longer file name, and the stems (`61-1s`) of the checked Epic's own rows. A number written next to such a key is still read, and so is a range such as `2-5 seconds` even when a story `2-5` exists, or `1-5s` when only another Epic has a row `1-5s-*`. A range that reads the same as a lettered stem of the checked Epic, `1-5s` with a row `1-5s-retry-story` in Epic 1, is left out with that stem. Still read as a threshold: another Epic's story named by its bare stem, a stem followed by a hyphen and a word that makes no key (`61-1s-sample`), and a number with a unit in the title of a story whose number has no letters (`7-2-30s-timeout`); cite a source on such a line or answer its candidate.
