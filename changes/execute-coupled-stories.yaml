type: changed
scope: ultracode-goal, ucg-resolve
summary: |
  Execute now has a route for two stories that are green only together, where the earlier story owes a clause only the later story's build can satisfy, so the earlier story's commit cannot be green alone. Before, the story loop had none, since a story advances only once its own committed `HEAD` is green. The run never commits the two together, leaves the earlier one uncommitted or gates both at one commit, and it never drives the two rows as one unit: that re-plan is the operator's, made outside the run. It captures, for each such clause, a run on the earlier story's tree showing that the code it needs exists only in the later story's build, and it moves a clause so measured to the later story only on the operator's ruling, since the move narrows the earlier story's acceptance criterion. That ruling is either an Operator notes entry given before launch that names both stories and authorizes the move, or the answer to an escalation of `kind` `coupled-stories` that names both stories, each clause, its measurement and the wording the run proposes for both story files. A general or standing delegation is not a ruling. `/ucg-resolve` closes that escalation by logging the proposal beside the operator's answer under both stories, and closes an answer that re-plans the rows only once the operator has made it. The run then writes the move into both story files, moves each clause's scaffolded acceptance cases to a file the later story's ATDD checklist lists in `generatedTestFiles`, and logs the move under both stories. Between decomposed children, only a whole claimed criterion moves, through a new split record. A headless run with no such note ends `blocked` on the escalation.
