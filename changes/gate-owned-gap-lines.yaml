type: added
scope: ultracode-goal
summary: |
  A `gate-gap:` line can now carry an `owned-by <owner> per <ruling>` marker at its end, written only when a written operator ruling (an Operator notes entry given before launch, or a decision `/ucg-resolve` recorded) names the story, the risk or gap the line names on a criterion the story keeps, and its owner now: a story of this Epic not yet `done`, or else a deferred-work row. At the start of each gate cycle the rulings are read again, so a ruling given after a line was logged marks it before automate runs. Before, an open line on a P0 criterion whose risk the operator had assigned to a later story was still measured and backfilled at every gate cycle, even at the re-gate of the same commit a closed `operator-evidence-owed` escalation owes: a red backfill sweep re-looped the story for work the operator had ruled out, and a green one committed past the commit the operator's records were made at. Automate now leaves an owned line alone: it re-runs no row behind it, measures and backfills nothing for it, and an owned line alone never makes it run, so a re-gate whose only open line is owned skips automate and commits nothing. A test automate backfills for one anyway is moved aside, unstaged, into the story's `.scratch-<story_id>/` folder and logged. An owned line never closes in its story, is never one of a re-loop's findings, and is copied unchanged into every cycle until a later written ruling takes the marker off. On `advance` or `defer` it becomes one `med` deferred-work row whose reason and suggested action name the owner and the ruling.
