type: breaking
scope: ultracode-goal
summary: |
  The Epic-level gate, `gate_eval.py --epic-level --rollup`, no longer escalates an Epic because one of its stories was decomposed and its split is recorded. The decomposition conventions set the parent's row `done` and move its contract into child rows, and nothing ever gates the parent, so the roll-up refused it as a `done` row with no gate artifact of its own and returned `NOT_EVALUATED` and `escalate` for every Epic that was ever split. A parent whose split record, `.split-<parent key>.json` beside `--sprint-status`, names it and names children each of which is another story row of the Epic is now read through its children: their gates count in its place, and a `reasons` line names it with them. Nothing but the record is read as a split. A parent with no record still refuses the roll-up, with a `reasons` line pointing at the record when rows above it extend its id, and so does a parent whose chain of records leads back to it. A parent with a trace report, gate decision or trace summary of its own, as `--story <parent key>` would find one, is read on that gate like any story, and refuses when it does not resolve. Stage 1's `done-without-gate-artifacts` audit no longer lists a parent the roll-up reads through.
migration: |
  If a pipeline relied on the Epic gate returning `escalate` for an Epic with a recorded split, it now gets the verdict the Epic's other rows earn. To keep a parent gated on its own, delete its `.split-<parent key>.json`, or give it a trace report and gate decision named for its key, which the roll-up then reads as it reads any story's.
