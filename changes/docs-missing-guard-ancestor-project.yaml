type: docs
summary: |
  Troubleshooting's "Every tool call is refused" entry now says what a moved or removed skill costs in a project that has a `pyproject.toml`, in its folder or a folder above it: before each refusal, `uv run` syncs that project, creating its `.venv` and `uv.lock` on the first call and building the project again whenever it changes, and the refusal can show that project's build error instead of `Failed to spawn`. It also says what the budget hook's command then does when the session stops. Where `uv` cannot find the script it exits 2, which Claude Code reads on a `Stop` hook as a block, so each stop is sent back with uv's error, up to eight times in a row before Claude Code lets it through. Where that project fails to build, or its dependencies cannot be resolved, `uv` exits 1, which Claude Code reads on a `Stop` hook as a non-blocking error, so the session stops and the turn goes uncounted. Reinstalling the skill ends both.
