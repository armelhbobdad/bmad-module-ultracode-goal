type: fixed
scope: ultracode-goal
summary: |
  In production, the gate now runs `bmad-testarch-automate` first and alone in its measurement worktree. NFR and test review were allowed to run beside it, but automate's mutation runs (`mutate_check.py`) edit source in the one worktree every assessor shares, so a concurrent assessor could run or time a mutant and record it as evidence about the commit under assessment. Once automate has finished, and its backfill, when it made one, is committed, the gate rebuilds the worktree at the commit under assessment (`git worktree remove --force`, then `git worktree add`, then the dependency links and the copied untracked inputs again), because no allowlisted command reads another worktree's status, and the rebuild also discards the copy of each backfilled test that automate puts in the worktree to confirm the test there. Only then do trace, NFR and test review start, in any order or concurrently. The rebuild is skipped only when no automate pass ran in the cycle, or when a red sweep over the backfill ended the cycle before trace, since then no other assessor runs in it. None of them may edit a file in the worktree, so none of them runs a mutant: an assessor that would probe one names it as a finding in its own artifact instead. The decision log's worktree line now also says whether automate ran alone and names the commit the worktree was rebuilt at.
