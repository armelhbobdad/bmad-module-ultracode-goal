type: fixed
scope: ultracode-goal
summary: |
  `mutate_check.py` reads four more kinds of output right. pytest quotes each test's traceback, message and captured output in its report (its ERRORS, FAILURES and PASSES sections, its warnings and its short summary), and a count quoted there, such as a `0 failed` a test prints, no longer stands in for the run's count. When pytest printed no stats line (`-qq`), or its stats line counted no failure, such a quote made a kill read as a row that cannot run, or a module that failed to collect read as a kill by a test of another name, under plain `-q` too. A count that another runner in the same command prints outside pytest's report, such as `cargo test`'s, is still read, also after a banner such as `===== rust =====`, which opens no report. Under pytest-xdist, a collection error at a path that holds a space, and one for a test class (`ERROR <path>::<Class>` in the short summary, an id whose last part starts with a capital letter), now count as collection errors rather than failures, so such a mutant reads 0 failed instead of a kill. When one command runs pytest twice, each run's collection errors are taken off its own stats line only: one run's collection error no longer stands as a failure when the two runs' flags print different signs of it, and a kill no longer reads 0 failed beside a `-qq` run. A `-qq` run that lists a failed test leaves the count unknown, so its kill stands, whatever count another runner in the same command prints, a `0 failed` included. Node's test runner reports a test file whose process failed as a failed test named after the file and located at its line 1, column 1. When a mutant stops the file loading (Node prints the error that stopped it), or the file's process exits non-zero after the row's own test passes, that test no longer counts, so such a mutant reads 0 failed, a row that cannot run, as a test file pytest, jest or vitest cannot load already did, rather than a kill. A test file whose process exits or crashes during a test, before Node reports the row's test, still reads as a kill, as a pytest test whose process dies does.
