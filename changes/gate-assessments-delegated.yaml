type: fixed
scope: ultracode-goal
summary: |
  In production, the run no longer produces a test review or an NFR assessment in its own session. The 8.1.0 bound on what a test reviewer is handed applied only when the review was delegated, so a run that ran `bmad-testarch-test-review` or `bmad-testarch-nfr` itself, in the session that holds every ruling it made, or that typed a Quality Score or an Overall Status by hand, was bound by nothing, and `gate_eval.py` cannot tell who wrote either file. The run now delegates each test review, the one Execute runs for each story and any the gate runs, and each NFR assessment to an agent it starts for that one assessment, one that starts without the run's conversation and so is never a fork of it, writes neither file itself, and changes no Quality Score, Recommendation or Overall Status in a file an assessor wrote. When the host refuses the agent's write of its file, the agent returns the file's text and the run writes it unchanged, as it already does for automate's summary. A hand-written `nfr-assessment.md` or `test-review.md`, for a story whose TEA skill cannot run, is now written by a delegated agent too. A session that cannot start such an agent still runs the skill itself, and so does a run whose delegated assessment ends in TEA's error that its configured execution mode cannot run there (`tea_capability_probe: false` with `tea_execution_mode` set to `subagent` or `agent-team`), which then runs that skill where the mode can run for the rest of the run: each says so in the decision log and goes on, so no run that works today stops. `gate_eval.py` is unchanged, so a given pair of files returns the verdict it returned before.
