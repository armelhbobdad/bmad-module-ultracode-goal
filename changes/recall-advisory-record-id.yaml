type: changed
scope: ultracode-goal
summary: |
  `mem_observation.py write` now decides an advisory's `recurred` itself when the call passes none, and Finalize's recall write names each advisory by the record it consumed: `--advisory sig=<record-id>` carries that record's `id` (the `run_id` of the run that wrote it), one for each record this invocation's own Stage 1 filter call consumed, and none on a resume routed into Execute. The script reads that record from this repo's folder of the store and stores `yes` when a root-cause signature outside the `other` class is in both records, `no` when that record has one and this run shares none, and `unknown` otherwise: a `sig` that is not a run id, a record it cannot read or that is not this repo's, a record with no such signature, or a run that did not advance and names no root cause. A matching gate status or verdict is not a recurrence, and preflight's `advisories_checked` status does not feed `recurred`. An explicit `recurred` is still stored as given. Before, the call site defined neither value, so runs of one Epic stored `recurred` both ways for one recalled outcome. The preflight scan's `advisories_checked` entries are now keyed by the same record id.
issues: [207]
