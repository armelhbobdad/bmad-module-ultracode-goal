type: changed
scope: ultracode-goal
summary: |
  A timeout in a wide sweep whose package then passes when re-run in isolation now has a stated outcome, where before the step said only to re-run the package and stopped there. Each isolation run runs once, on its own (one package at a time, with no other suite or build the run started still running), at the same tree with nothing changed, cache-defeated, under the test command and time bound the sweep gave that package. A pass puts no red in that sweep, so a sweep that ran every task it scheduled and whose only reds were such timeouts is its step's green: step 2, and a gate step that writes the tests-ran marker after its sweep, write the marker from that sweep, and the re-verify on the committed HEAD keeps its marker and commits nothing. Each such pass logs one `timeout:` line in `.decision-log.md` naming the package, the `HEAD` the sweep ran at, the sweep's capture and the isolation run's capture. Both captures are kept in `evidence-<story_id>/`, the isolation run as `isolation-<step>-<short sha>.log`, so it is never taken for a second sweep's capture. The timeout writes no `flaky:` line of its own and no deferred-work ledger row. A sweep that left tasks unrun, as a runner that stops at its first failure (turbo without `--continue`) does, and whose only reds were timeouts runs once more in full before any isolation run and is read instead, and at the gate's backfill that re-run spends neither of its two fixes. A package that fails in isolation too makes the timeout that sweep's red.
