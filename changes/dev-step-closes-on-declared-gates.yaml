type: changed
scope: ultracode-goal, ucg-dev-story
summary: |
  The dev step now runs, and fixes where it can, the quality gates the story's sweep will run, not only the default test task. Before Execute delegates a story to `ucg-dev-story`, it reads the quality tasks the repository declares and passes a new `declared_gates` input: the command for each task the sweep will run that the default test task leaves out, such as a `test:coverage` threshold or a `test:storybook` task declared beside `test` rather than under it. `ucg-dev-story` runs those commands after its full regression suite, narrowed to the packages the story's changes touch where a command allows it, and fixes a red one where it can, before it sets the story to `review`. Such a red usually showed first at the sweep, after the story was already at `review`, and cost a fix round and a second full sweep. After a fix that changed a file, `ucg-dev-story` runs its full regression suite again and keeps no fix that turns it red, and it makes no fix that needs a dependency or a configuration file the story does not specify. A declared gate never stops the dev step: one it cannot get green is named in its completion notes, the story moves to `review` as before, and the sweep meets that red as it always has. A task the sweep will not run is never passed, and without the input `ucg-dev-story` runs as before. The sweep itself is unchanged, and the dev step's run of these commands stands in for no part of it: it writes no tests-ran marker.
