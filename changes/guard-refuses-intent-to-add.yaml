type: breaking
scope: ultracode-goal
summary: |
  The PreToolUse guard now refuses any `git commit` while the index holds an intent-to-add entry (`git add -N`), with a reason that starts `Intent-to-add guard: refusing` and names each such path. A commit leaves such an entry out while the index keeps it, and over a path HEAD holds (`git rm --cached`, then `git add -N`) it deletes HEAD's file; the un-skip proof read a marked acceptance test as an empty file with no `test.skip(` in it, so a commit that left a still-skipped acceptance test out went through, where the same file untracked was refused. The check runs after the empty-index check and before the un-skip proof, and it refuses the commit when git cannot list the entries. An index that holds only marks on new files still gets the empty-index refusal; a mark over a path HEAD holds counts as staged work there, since the commit would delete that file, and this check refuses it. A commit made with such an entry in the index used to pass the guard and now halts.
migration: |
  Clear each path the refusal names before the commit. Stage each marked file the commit should carry (`git add -- <path>`); a mark on a path HEAD already holds is cleared the same way, staging the file in place, since moving it aside would stage its deletion. For a marked new file the commit should not carry, move it aside into the story's `.scratch-<story_id>/` folder, run `git add -- <path>`, which clears its entry, then move it back, where it is untracked again; delete it only when nothing needs it. Then commit again.
