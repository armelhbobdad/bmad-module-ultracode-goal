type: fixed
scope: ultracode-goal
summary: |
  `mutate_check.py` now reads 0 failed, a row that cannot run, when the mutant stops Node's test runner in its own process with no test gone red, as the gate's reference says a test file Node cannot load, and one whose process exits non-zero after the row's test passes, reads. Under `node --test --test-isolation=none` (`--experimental-test-isolation=none`, its only name on Node 22), which imports every test file in the runner's own process, Node reports a file that throws as it loads as a failed test named after it, with the error the file threw and no `Node.js v` line, and the row read as a kill; such a test now comes off the failure count, on Node 22 too, which gives it no location, and when the file threw `undefined`, which leaves it no error at all, while a test that fails beside it still reads as the kill. A module that calls `process.exit` there after the row's test passed ends the runner itself before it prints a summary, and read as a kill too; output that reports that pass, no failed test and no summary now reads 0 failed, while an exit before Node reports the row's test still reads as a kill, as a process that dies during a test does. The last line Node's spec reporter prints, which ends with no line break, is no longer read as one line with the first line the command wrote to stderr. A mutant that makes the module `--test-global-setup` names throw stops the runner before any test, with no summary, and read as a kill as well; it now reads 0 failed unless another summary in the output counted a failure, and the gate's reference names that case.
