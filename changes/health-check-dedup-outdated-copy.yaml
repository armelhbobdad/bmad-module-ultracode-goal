type: docs
summary: |
  The Health Check page now says how the repository's dedup Action handles a report from a copy older than the fix. When no open issue shares the report's fingerprint but an earlier issue with it was closed as completed, and the report's Environment table gives a Module Version lower than the repository's latest release, the Action comments that the earlier issue was fixed, asks the reporter to update to that release and to report again if the behaviour is still there, adds the `duplicate` label and closes the report as not planned, never as completed. Any doubt (a Module Version that is missing or not a plain `X.Y.Z`, no release, a fix closed after that release, a failed call) leaves the report open for a maintainer. A copy of the Action in another repository compares with that repository's latest release.
