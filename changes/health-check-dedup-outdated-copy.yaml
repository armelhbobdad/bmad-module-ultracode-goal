type: docs
summary: |
  The Health Check page now says how the repository's dedup Action handles a report from a copy older than the latest release. When no earlier open issue shares the report's fingerprint but an earlier issue with it was closed as completed before that release was published, and the report's Environment table gives a Module Version lower than the release, the Action comments that the earlier issue was fixed, asks the reporter to update to that release and to report again in a new issue if the behaviour is still there, adds the `duplicate` label and closes the report as not planned, never as completed. Any doubt (a Module Version that is missing, given twice or not a plain `X.Y.Z`, no release, a fix closed after the release was published, a failed call) leaves the report open for a maintainer. A copy of the Action in another repository closes nothing this way.
