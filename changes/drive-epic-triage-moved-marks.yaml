type: fixed
scope: ultracode-goal
summary: |
  The triage `scripts/drive_epic.py` prints after a spawn stops now names an intent-to-add file the story moved. It reads `git status` with `--no-renames`: with rename detection on, git paired a moved tracked file's mark with its old path into one rename entry, and the `DANGER` list left that file out. It also names a mark over a path HEAD holds (`git rm --cached`, then `git add -N`, status `DA`), which it used to leave out. The list now also says that `git restore <path>` empties these files, as `git checkout -- <path>` does, and that `git reset --hard` deletes a new one and reverts a tracked one to HEAD, discarding its edits. Execute now marks a story's new files intent-to-add before each sweep, so a session killed before its commit leaves such files routinely.
