type: fixed
scope: ultracode-goal, ucg-resolve
summary: |
  Execute's move of an acceptance criterion between two decomposed children that are green only together now covers a later child split off after Stage 3, which has no ATDD checklist until its own ATDD run after its step 0. The move rewrote both children's checklists and moved the earlier child's scaffolded cases into a file the later child's checklist lists, which did not exist yet, so the run had to improvise. For such a child the move now writes no checklist: it rewrites the criterion numbers in the earlier child's checklist alone, removes each moved clause's cases from the files that checklist lists in `generatedTestFiles` instead of moving them, and parks no copy. A listed file the removal leaves with no case comes off `generatedTestFiles` first and is then deleted, in the same pass, and when no listed test file is left, its path is also taken out of the checklist's text, which the commit guard then reads in the list's place. The later child's ATDD run then scaffolds the moved criterion from its rewritten row, or, on a stack ATDD cannot run on, its step 1 establishes that criterion's red phase from the row. The earlier child's evidence folder keeps what it captured, and the move's `.decision-log.md` entry names each removed case. A later child that has a checklist is handled as before. `/ucg-resolve` now names the earlier child's checklist, and the later child's only when it has one, among the records such a move rewrites.
