type: fixed
scope: ucg-dev-story
summary: |
  `ucg-dev-story` no longer meets a definition-of-done checklist that fails a story on a declared gate it could not get green. Its "Declared Gates" section said four items of `checklist.md` count such a gate as reported, never failed, while those items still asked that all existing tests pass, that every quality check complete successfully and that no blocking issue remain, so a story handed `declared_gates` could fail its checklist on the very red the section had told it to report and leave to the run's sweep. The Regression Prevention, Code Quality and Quality Gates Passed items now count a gate in `declared_gates` still red as reported, never failed, and the No HALT Conditions item says such a gate is no HALT condition. The definition-of-done list in step 9 ends on a note that a gate the run handed the workflow, still red after that step, counts as reported, never failed. The note covers only such a gate: a red regression suite still fails the definition of done, as it did before.
