type: fixed
scope: ultracode-goal
summary: |
  `mutate_check.py` now carries the `# /// script` header the other scripts carry, so a plain `uv run` of it works inside a project that has its own `pyproject.toml`. It also reads more test runners' output: Node's spec and TAP reporters, jest's default, `--verbose` and agent reporters (recent jest versions pick the agent reporter under Claude Code), vitest, and pytest's `-v`, `-rA` and xdist output, also behind the prefix turbo or pnpm puts on each line of a task's output. A failure word in the expected test's own name no longer counts, so a passing test named `rejects error input` is not credited with a kill, and neither is a passing test that a jest or vitest code frame quotes or that pytest `-rA` lists among its passes. The failure count is read from each run's summary line (Node's `fail` count, the `Tests` line of jest and vitest, pytest's last line, where a test whose fixture raised counts as failed too), and the counts of several such summaries in one command are added, so two failing tests in one jest file read `KILLED+others` and a command that runs two suites or two runners reports their total. Before, under `node --test` on Node 23 or later and under jest, a real kill read `MISATTRIBUTED`, and a passing test whose name held a word such as `error` could be credited with a kill under Node, pytest, jest or vitest.
