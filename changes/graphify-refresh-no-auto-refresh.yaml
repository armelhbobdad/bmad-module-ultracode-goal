type: changed
scope: ultracode-goal
summary: |
  With `graphify_integration = "refresh"`, Finalize now runs `GRAPHIFY_NO_AUTO_REFRESH=1 timeout 300 graphify update .`, so the refresh writes only `graphify-out/` (or wherever `GRAPHIFY_OUT` points). Before, graphify's own housekeeping ran with it. After a graphify upgrade it re-copied the skill files `graphify install` put in your home directory, such as `~/.claude/skills/graphify/`, and kept the old `SKILL.md` as `SKILL.md.bak`. On any run it could replace an outdated graphify OpenCode plugin, or drop its stale `opencode.json` entry, under `.opencode/` in the project or your home directory, and in a project that commits `.opencode/` that could leave a modified tracked file after the last story commit. The graphify commands you run yourself still do that housekeeping. If you allowed the refresh with an `allowlist_commands` entry for the binary alone (`graphify`), replace it with the whole command, `GRAPHIFY_NO_AUTO_REFRESH=1 timeout 300 graphify update .`. Claude Code does not match an allow rule past a leading assignment of a variable it does not know, so the old entry no longer covers the refresh: under Auto Mode the permission classifier decides whether it runs, and in a mode that asks first it is denied and logged as `WARN graphify-refresh-failed` while the run goes on unchanged. Replacing the entry leaves the allow rule an earlier preflight wrote for it, such as `Bash(graphify:*)`, in `.claude/settings.local.json`; delete that rule yourself unless you want every graphify command, `graphify extract` included, to run without asking.
