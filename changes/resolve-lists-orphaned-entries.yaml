type: changed
scope: ucg-resolve
summary: |
  `/ucg-resolve` now presents a `.decisions.json` entry that is not a `close` as pending only while an item the pass enumerated carries its id: a RED in `.preflight-reds.json`, an open ledger `decision:` row, or an `escalation-<story_id>.json` sidecar, which also carries the ids minted from each spelling of its own path that the resume reads a close by. An entry no item carries is orphaned: the pass lists it after the pending items, apart from them, with its id, its answer and each earlier answer its `history` holds, asks nothing about it, and keeps it in the record as it stands. The pass and its closing summary say that a later preflight can raise an orphaned entry again and block on it, since `.preflight-reds.json` is one project-wide file each preflight replaces, so it holds only the last preflight's REDs, from whichever Epic ran it, and that the pass after that preflight asks it. A pass that finds only orphaned entries no longer says the run stopped for a reason that is not a decision: it points at the read-only `/ucg-status`, as an empty pass does, and hands back only when the operator asks for the resume. When a source cannot be read in full, nothing is called orphaned and every such entry is presented as pending, as before. Before, the pass presented every such entry again and said its question still blocked, although preflight and the resume read only the `close` entries and block only on a source.
