type: added
scope: ultracode-goal
summary: |
  New `customize.toml` key `cross_session_recall_store` in `[workflow]`: the folder of the local run store that Cross-Session Recall moves to, where each run keeps one immutable record on this machine, at `<store>/<fingerprint-dir>/runs/<run_id>.jsonl`. It ships as `""` with no default, and an empty or blank value, an unresolved `{...}` token, a literal `$VAR` or `%VAR%` and a relative path count as unset. Set it to a `~` path, expanded like `health_check_seen_cache`, such as `~/.ultracode-goal/recall`, or to an absolute or `{project-root}` path. A store folder the scripts create gets its own `.gitignore` holding `*`, so a store inside your workspace leaves `git status` clean.
issues: [105]
