type: changed
scope: ultracode-goal
summary: |
  On a project whose BMAD artifact tree git does not track (an ignore rule covers it, or it sits outside the repository or behind a symlink), `preflight_check.py` reports `impl_artifacts_tracked: false`, never as a blocker. The launch briefing then says that deleting the Epic branch undoes the code only and names what survives, and no acceptance criterion or test the run writes may have a test read a file under that tree, since it does not exist in CI.
