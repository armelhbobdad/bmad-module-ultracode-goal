type: changed
scope: ultracode-goal
summary: |
  On a project whose BMAD artifact tree git does not track (an ignore rule covers it, or it sits outside the repository or behind a symlink), `preflight_check.py` reports `impl_artifacts_tracked: false`, never as a blocker, in its step-1 report and in the `--assert-armed` manifest a resumed session reads. Preflight then says, in a blocked account as in the launch briefing, that deleting the Epic branch undoes the code only, and names what survives: the story files and untracked edits there, and the run folder and test-artifacts tree when git ignores them. No acceptance criterion or test the run writes may read a file under that tree at run time, since it does not exist in CI; Define-Done and Execute repeat the rule.
