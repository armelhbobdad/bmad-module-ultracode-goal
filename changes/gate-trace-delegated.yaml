type: fixed
scope: ultracode-goal
summary: |
  In either profile, the run no longer runs TEA's trace, or writes the trace files that stand in for it, in its own session. 8.1.1 bound where a test review and an NFR assessment are made and did not bind `bmad-testarch-trace`, whose `gate_status` decides the verdict first: under `--light` it is the whole gate, and in production the NFR and test-review checks can only lower it. So a run could run trace, or write `trace-<story_id>.md` and `gate-decision-<story_id>.json` itself where trace cannot run, in the session that holds every ruling it made, and `gate_eval.py` cannot tell who wrote either file. The run now delegates each `bmad-testarch-trace` run to an agent it starts for it, one that starts without the run's conversation and so is never a fork of it, has such an agent write each trace file the gate stage has it author where trace cannot run (the trace report and gate decision, an `e2e-trace-summary` written in their place, and the epic's own pair), and changes no `gate_status` in a file trace or such an agent wrote. The cases that let a test review or an NFR assessment run in the session hold for trace too: a session that cannot start such an agent runs trace itself, or writes the two files itself where trace cannot run; a run whose delegated trace ends in TEA's error that its configured execution mode cannot run there (`tea_capability_probe: false` with `tea_execution_mode` set to `subagent` or `agent-team`) runs trace where that mode can run, for the rest of the run; and a session that cannot wait for an agent it starts when `tea_execution_mode` is `sequential` runs trace itself. Each says so in the decision log and goes on. The gate stage also no longer says `gate_eval.py` uses the three gate artifacts "without caring how they were produced", which read as leave to produce them any way: it now says the script reads them as files and checks neither their order nor their author, which is why the stage binds how each is made. `gate_eval.py` is unchanged, so a given set of files returns the verdict it returned before.
