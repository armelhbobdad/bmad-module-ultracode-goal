type: fixed
scope: ultracode-goal
summary: |
  The `PreToolUse` guard's un-skip check now reads a story's acceptance-test files from the `generatedTestFiles` list in the frontmatter of its ATDD checklist, the list TEA's ATDD writes of the test files it scaffolded. It used to take every test-file path anywhere in the checklist. So a case cited in a table by bare file name (`login.spec.ts::logs the user in`), a glob, a partial path or a test the story only read made `git show :<path>` fail or read the wrong file, and the story's commit was denied although every listed file was staged un-skipped. A checklist with no `generatedTestFiles` list, or one that names no JS or TS test file, is still scanned whole as before. A listed file that is not staged still denies the commit, and the deny now names the list. A list that cannot be read as a YAML list now denies the commit and says what is wrong with it. When a story moves acceptance cases into a new test file, add that file to the list.
