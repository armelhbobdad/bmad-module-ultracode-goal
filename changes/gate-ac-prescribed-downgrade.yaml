type: changed
scope: ultracode-goal, ucg-resolve
summary: |
  A production-signal downgrade that the story's own acceptance criterion forces now escalates instead of re-looping. Under `--profile production`, `gate_eval.py` downgrades an `advance` to `reloop` when the test review scores below 80 or says `Block`, or the NFR assessment reads `FAIL`, and the gate sent every such downgrade through `bmad-correct-course` and a re-run. When the finding behind it was behaviour a criterion requires as written (a criterion that orders two steps with a bare timer, under a test review that scores every such timer), no fix could clear it while the criterion stayed met, so the story re-looped until its turn ceiling stopped it as `budget-overrun`. The gate now reads the failed signal's findings against the story's criteria before the generalize step: when every finding behind the failure is one a criterion prescribes, it stops at once with an escalation of `kind` `ac-amendment-needed` whose decision names the commit under assessment and quotes each criterion as it stands, beside the finding it forces and a proposed amendment, and it writes no `class:` line and spends no re-loop. The amendment is the operator's own edit of the story file, or of the parent's story file for a decomposed child, which the run never edits. `/ucg-resolve` closes the escalation once the story file states the amended text of each criterion it names, or once the operator rules in writing that a finding is not prescribed, which the next gate then re-loops on. It records `defer` while a criterion still reads as the decision quotes it, and never edits a criterion itself. The resumed run then drives the story again on the turn count it had, and until the story advances each of its gate cycles names the main-tree story file to trace, since no commit carries the amendment before then. `gate_eval.py` is unchanged and still prints `reloop` for such a story, since the gate has no waiver for a failed production signal. A downgrade with findings no criterion prescribes re-loops for those findings as before, and so does a signal that failed with no finding to read (a file not given, missing or unreadable, a score or status that could not be found, or an NFR status of `NOT_ASSESSED`).
