type: fixed
scope: ultracode-goal
summary: |
  The gate now writes the heading `### Story <story_id>: gate` in `.decision-log.md` before each gate cycle's entries, with `<story_id>` the sprint-status key, so the gate trail (`gate-trail.md`) reads the verdict the run recorded for each story. No reference named that heading before, and the trail found no recorded verdict for a story whose verdict JSON stood under no heading of its own reading `Story` and then an id starting with a digit (so a letter-prefixed key was never read), or whose verdict was logged inline in backticks rather than fenced: it showed the gate file's status mapped through the gate's table, so a `PASS` the production signals downgraded to `reloop` read `advance`, and a red backfill sweep's `reloop` went unread. The gate logs the cycle's verdict under that heading as a fenced JSON object, and the trail reads the first verdict object under a story's heading, fenced or inline in backticks as some runs log it, but never the Epic-level roll-up's (`"epic_level": true`), which follows the last story's entries, nor one whose `reasons` say it read another story's gate file. A later `### Story <story_id>: gate` heading for the same story replaces what an earlier one recorded, so the story's last cycle decides, and when the trail finds no verdict under that heading, it shows the gate file's status, mapped, never an earlier cycle's verdict. Any other later heading for the story, such as `### Story <story_id>: re-loop 1`, is no gate cycle, and replaces that verdict only with a verdict object of its own. A heading names a story when its id starts with a digit, is a key `sprint-status.yaml` lists (so a letter-prefixed key such as `lp-0-1-...` is read too), or stands in that prescribed shape, and any other heading starting with `Story` is prose that ends no story's entries.
