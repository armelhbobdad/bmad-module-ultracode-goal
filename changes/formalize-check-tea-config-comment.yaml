type: fixed
scope: ultracode-goal, ucg-formalize
summary: |
  `formalize_check.py`, the readiness check that preflight and `/ucg-formalize` run, now reads the TEA config's `trace_output` value, else its `test_artifacts` value, with preflight's own reader. Before, its own copy of that reader kept an inline comment in the value, so `test_artifacts: <path>  # where TEA writes` named a folder whose name ended in `# where TEA writes`. It also broke a quoted value followed by a comment, read the next line as the value when the key had none on its own line, and read an empty `trace_output` (which `npx bmad-method install --set tea.trace_output=` writes) as no root at all instead of falling back to `test_artifacts`. A key given twice now reads its last value, as preflight reads it. The folder it found did not exist, so a test-design under the real root went unread: its risk-matrix checks never ran, and neither did the check for the NFR assessment it implies. A TEA artifact under a root inside the implementation artifacts was also reported as a leaked artifact to move. After the upgrade, an Epic whose TEA config has one of these lines gets the verdict the same config without them already got, so it can stop at preflight where it launched before: when the root holds a test-design and no `nfr-assessment.md`, the check reports `missing_nfr_assessment`, which no remediation clears, `/ucg-formalize -H` returns `status=blocked`, and a headless run stops. Run TEA's NFR assessment so that `nfr-assessment.md` lands under that root, then run preflight again. A config the installer wrote reads as before, unless it sets an empty `trace_output`.
