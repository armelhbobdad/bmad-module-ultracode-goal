type: fixed
scope: ultracode-goal, ucg-formalize
summary: |
  `formalize_check.py`, the readiness check that preflight and `/ucg-formalize` run, now reads the TEA config's `trace_output` value, else its `test_artifacts` value, with preflight's own reader. Before, its own copy of that reader kept an inline comment in the value, so `test_artifacts: <path>  # where TEA writes` named a folder whose name ended in `# where TEA writes`. It also broke a quoted value followed by a comment, and it read the next line as the value when the key had none on its own line. The folder it found did not exist, so a test-design under the real root went unread: its risk-matrix checks never ran, and neither did the check for the NFR assessment it implies. A TEA artifact under a root inside the implementation artifacts was also reported as a leaked artifact to move.
