type: changed
scope: ultracode-goal
summary: |
  A red in a wide sweep that the story's changes do not explain now has a route of its own, where before the only written route was to remediate and re-commit, which cannot run when the story's code needs no change. It applies when the failing case is not a timeout, its test file is in neither `git diff --name-only` from the story's baseline nor `git status --porcelain --untracked-files=all`, its failure names no path those list, and the output shows the cause inside that test; state another test left behind (the order the cases ran in, a shared fixture, a leftover file or port) never qualifies. The same sweep then runs once more at the same tree and scope, cache-defeated. A second sweep with no red is the step's green: a `flaky:` line in `.decision-log.md`, a deferred-work ledger row with `source` `sweep` and `severity` `med`, nothing edited in that test file, nothing committed at the re-verify on the committed HEAD, and the tests-ran marker as after a green first try. The gate's backfill sweep reads such a red the same way and does not count the second sweep as one of its two fixes. Any red in the second sweep is a red and takes its step's route.
