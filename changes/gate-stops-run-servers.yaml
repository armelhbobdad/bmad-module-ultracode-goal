type: added
scope: ultracode-goal
summary: |
  `scripts/probe_servers.py` takes two new flags, `--stop-since <file>` and `--root <dir>` (repeatable, and the two go together), and the gate now uses them to stop a server the run itself left up. Execute's last sweep runs the browser tests in the main tree right before the gate, and a server its runner started through a launcher such as turbo, which runs it in a process group of its own, stayed up after it: at the gate's first check it answered from the main tree, and the gate's rule that it never stops a server left its runs in the measurement worktree reusing it, so they measured the main tree. Under a scratch runner config whose only start command is a launcher, each run left such a server up on the config's port, and nothing stopped them, so they piled up over an Epic. The gate now runs every check of the URLs a runner may reuse, automate's included, with `--stop-since` naming the story's `.baseline-<story_id>` marker and `--root` naming the project and the gate worktree, and runs it once more over those URLs and the scratch config's when the story's verdict is recorded. The probe stops a server only when, on Linux, every process in its process group is the caller's user's, has no controlling terminal and started after that marker was written, the process that led its session has exited, and the server runs from inside a `--root`. It sends the group SIGTERM, then SIGKILL to what is left, and checks the URL again. It never signals its own process group or one that holds a process that started it, and on another system it stops nothing. With the flags, its JSON adds `stopped` (each server it stopped, with its process groups and pids) and `left` (each URL that still answers, with the reason it left that server up), `answering` and `free` say what answers after the stops, and it exits 0 only when no URL still answers; a `--stop-since` file it cannot read exits 2. Without the flags its output and exit codes are unchanged. Every other server stays one the gate leaves up, and the decision log's worktree line names each server the probe stopped. The operating tips, troubleshooting and `SECURITY.md` say which server of yours can meet every condition: one you start during a drive, inside the project and on a port the gate checks, from a terminal you then close.
