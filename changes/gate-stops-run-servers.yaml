type: added
scope: ultracode-goal
summary: |
  `scripts/probe_servers.py` takes two new flags, `--stop-since <file>` and `--root <dir>` (repeatable, and the two go together), and the gate now uses them to stop a server that reads as one the run itself left up. Execute's last sweep runs the browser tests in the main tree right before the gate, and a server its runner started through a launcher such as turbo, which runs it in a process group of its own, stayed up after it: at the gate's first check it answered from the main tree, and the gate's rule that it never stops a server left its runs in the measurement worktree reusing it, so they measured the main tree. Under a scratch runner config whose only start command is a launcher, each run left such a server up on the config's port, and nothing stopped them, so they piled up over an Epic. The gate now runs every check of the URLs a runner may reuse, automate's included, with `--stop-since` naming the story's `.baseline-<story_id>` marker and `--root` naming the project and the gate worktree, and runs it once more over those URLs and the scratch config's after each gate cycle's last test run and before its verdict is logged, so a session that ends first leaves the story's next gate, under the same marker, to stop what it left up. The probe stops a server only when, on Linux, every process in its process group is the caller's user's, has no controlling terminal and started after that marker was written, the process that led its session has exited, no other process that still runs in that session started before the marker or is the parent of a process in the group (a watcher or supervisor, such as watchexec, which runs its server in a group of its own and starts it again in a new one when the run's edits change a file), and the server runs from inside a `--root`. For a URL whose connection no server on this machine took, because it reached an address that is not one of this machine's own, a container's say, or because `/proc` lists no socket that could have taken it, it stops nothing. It sends the group SIGTERM, then SIGKILL to what is left, and checks the URL again; a process still running after the SIGKILL, one that left its group on the SIGTERM say, leaves that server stopped only in part, and it signals those processes no more, for that URL or another, and checks the URL once more: it leaves the URL up when one of them holds a socket that could have taken its connection, and otherwise reads it as before, so another server that answers it then, at another of its host's addresses say, gets a verdict of its own. A URL it read before a later URL's stop it reads again after that stop, since that stop can end the server that answered it. It reads the group again right before and right after each signal and names each process it finds there, a worker the server forked since the first read included. It never signals its own process group or one that holds a process that started it, and on another system it stops nothing. With the flags, its JSON adds `stopped` (each server it stopped, in whole or in part, with the process groups it signalled, the pids of the processes that exited, `partial`, true when some of its processes still ran after the SIGKILL, and `running`, the pids of those; a server stopped only in part is listed there when one of its processes exited or the ones still running no longer answer its URL) and `left` (each URL that still answers, with the reason it left that server up; for a URL that processes a stop left running still answer, the reason names the process groups signalled and those processes), `answering` and `free` say what answers after the stops, and it exits 0 only when no URL still answers. A URL it refuses, or a `--stop-since` file it cannot read, exits 2 before anything is stopped. Without the flags it stops nothing, and its output keeps its two keys and its exit codes their meaning. Every other server stays one the gate leaves up. Automate names in its summary each server the probe stopped at one of its checks, and the decision log's worktree line names each server the probe stopped, automate's included, by its URL and the folder it ran from. Those conditions are signs, not proof, so the operating tips, troubleshooting and `SECURITY.md` say which server of yours can meet every one: one you start inside the project and on a port the gate checks, in the background by a command that has since exited or from a terminal you then close, at any time after the story's marker was written, which a resume keeps, so the time between a stopped run and its resume counts too, when nothing that began before the marker still runs in its session; and one that a watcher of yours starts again after the marker, when the watcher too began after it and runs in the server's process group, or starts the server through a command that then exits and either began after the marker or had that command give the server a session of its own.
