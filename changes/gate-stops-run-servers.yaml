type: added
scope: ultracode-goal
summary: |
  `scripts/probe_servers.py` takes two new flags, `--stop-since <file>` and `--root <dir>` (repeatable, and the two go together), and the gate now uses them to stop a server that reads as one the run itself left up. Execute's last sweep runs the browser tests in the main tree right before the gate, and a server its runner started through a launcher such as turbo, which runs it in a process group of its own, stayed up after it: at the gate's first check it answered from the main tree, and the gate's rule that it never stops a server left its runs in the measurement worktree reusing it, so they measured the main tree. Under a scratch runner config whose only start command is a launcher, each run left such a server up on the config's port, and nothing stopped them, so they piled up over an Epic. The gate now runs every check of the URLs a runner may reuse, automate's included, with `--stop-since` naming the story's `.baseline-<story_id>` marker and `--root` naming the project and the gate worktree, and runs it once more over those URLs and the scratch config's after each gate cycle's last test run and before its verdict is logged, so a session that ends first leaves the story's next gate, under the same marker, to stop what it left up. The probe stops a server only when, on Linux, every process in its process group is the caller's user's, has no controlling terminal and started after that marker was written, the process that led its session has exited, and the server runs from inside a `--root`. It sends the group SIGTERM, then SIGKILL to what is left, and checks the URL again. It never signals its own process group or one that holds a process that started it, and on another system it stops nothing. With the flags, its JSON adds `stopped` (each server it stopped, with its process groups and pids) and `left` (each URL that still answers, with the reason it left that server up), `answering` and `free` say what answers after the stops, and it exits 0 only when no URL still answers. A URL it refuses, or a `--stop-since` file it cannot read, exits 2 before anything is stopped. Without the flags its output and exit codes are unchanged. Every other server stays one the gate leaves up. Automate names in its summary each server the probe stopped at one of its checks, and the decision log's worktree line names each server the probe stopped, automate's included, by its URL and the folder it ran from. Those conditions are signs, not proof, so the operating tips, troubleshooting and `SECURITY.md` say which server of yours can meet every one: one you start inside the project and on a port the gate checks, in the background by a command that has since exited or from a terminal you then close, at any time after the story's marker was written, which a resume keeps, so the time between a stopped run and its resume counts too.
