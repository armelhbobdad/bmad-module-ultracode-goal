type: docs
summary: |
  Troubleshooting and Getting started now say what a headless resume does when the settings write it makes to re-arm the hooks is refused, and how to get past it. Such a resume escalates the story it was about to drive, so the attended resume the 4.0.0 migration asks for makes the write and then closes that escalation with `/ucg-resolve`, which it offers before it drives the story; at preflight, `/ucg-resolve` is still not the way back. Both also say which resume re-arms the hooks when a reason that is yours to fix, such as a Claude Code older than 2.1.295, stands beside that need: the resume escalates it first, and the resume after your fix makes the write, so that is the one to run attended. They also correct the migration's claim that a headless session cannot approve that write: under `bypassPermissions` it lands and under Auto Mode the classifier decides, while under `default`, `acceptEdits` (the mode `drive_epic.py` spawns in by default) or `dontAsk` it is refused.
