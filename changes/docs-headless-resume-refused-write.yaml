type: docs
summary: |
  Troubleshooting and Getting started now say what a headless resume does when the settings write it makes to re-arm the hooks is refused, and how to get past it. Such a resume escalates the story it was about to drive, so the attended resume the 4.0.0 migration asks for makes the write and then closes that escalation with `/ucg-resolve`, which it offers before it drives the story; at preflight, `/ucg-resolve` is still not the way back. They also correct the migration's claim that a headless session cannot approve that write: under `bypassPermissions` it lands and under Auto Mode the classifier decides, while under `default`, `acceptEdits` (the mode `drive_epic.py` spawns in by default) or `dontAsk` it is refused.
