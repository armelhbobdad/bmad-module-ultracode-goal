type: changed
scope: ultracode-goal
summary: |
  A story's `.scratch-<story_id>/` folder now lasts until the story advances: the gate's advance route removes it once the evidence commit is made, its `evidence-commit-rejected` escalation is written, or nothing is staged for it, and a `reloop` or `escalate` verdict leaves it in place. Before, Execute removed it once step 5's re-verify went green, before the gate, and the gate's backfill removed it again, so a later sweep of the same story that does not re-drive it (the re-gate a closed `operator-evidence-owed` escalation owes, the gate's backfill sweep, a cap-only re-loop's sweep, and the resume of a story committed but never gated) had to re-author any runner or harness built there by hand, which could measure a different gate set. The re-gate now re-measures with any runner or harness the escalated cycle built there, and when it built one and the folder is gone, re-authors it for the story's declared gate set and checks it against the gates named by the escalated cycle's step-5 capture in `evidence-<story_id>/`. A resume that finds the folder for a story whose row is already `done` removes it at its check before the next story's step 0, the one that also makes an advanced story's owed evidence commit, so a run that stopped after that commit, or with nothing staged for it, leaves no folder behind.
