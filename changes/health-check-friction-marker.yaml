type: changed
scope: ultracode-goal
summary: |
  The health check now reports every `friction:` entry the decision log gained since the last health check, not only the ones its own invocation wrote. Each health check, however it ends, appends exactly one `health-check:` line to `.decision-log.md` (`health-check: disabled`, `health-check: clean`, `health-check: discarded`, or `health-check: done` with how many findings were filed, upvoted, queued or already handled), and reads the `friction:` entries logged after the last such line. The `done` line is appended before the check shows or logs the issues it created, the findings it queued and "Workflow complete.", so a session closed at any of those lines still has it. A run that blocks at Stage 1 or Stage 2 still runs no health check, but the next run of that Epic that reaches Finalize, if one does, now reports the friction it logged, and so it does for a health check that was interrupted or left unanswered at its gate. The off switch and the headless clean exit now log this line in place of the lines they logged before, so a run with the check turned off closes the `friction:` entries logged so far, and turning it back on reports only friction logged after that. A `friction:` entry or a marker is read only at the start of its line, never one quoted inside another entry, and an entry whose section or instruction the current stage file no longer carries is dropped.
