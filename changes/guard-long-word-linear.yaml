type: fixed
scope: ultracode-goal
summary: |
  The `PreToolUse` guard now reads a Bash command holding one long word in time linear in the word's length. Its shell lexer, and the symlink resolution its Cross-Session Recall check runs on every path a command names, took time in the square of that length, so a single word of about 2.5 MB kept the guard past Claude Code's 600-second hook timeout, and with the guard armed with `"onFailure": "block"` Claude Code refused the call. Such a command is now decided in seconds. A path longer than 32,768 characters still has its symlinks resolved, a stretch at a time, so a long word that reaches the recall store through a link it names is still refused: `H/.ultracode-goal/recall/` and a glob of 33,000 `*`, with `H` a link to the home folder, or `mkdir -p` through a linked folder. A glob that matches a link's own name, such as the `[H]` in `[H]/.ultracode-goal/recall/*`, is not resolved at any length, as before, and SECURITY.md now lists it among the guard's limits.
