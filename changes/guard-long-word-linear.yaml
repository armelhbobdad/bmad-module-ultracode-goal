type: fixed
scope: ultracode-goal
summary: |
  The `PreToolUse` guard now reads a Bash command holding one long word in time linear in the word's length. Its shell lexer, and the symlink resolution its Cross-Session Recall check runs on every path a command names, took time in the square of that length, so a single word of about 2.5 MB kept the guard past Claude Code's 600-second hook timeout, and with the guard armed with `"onFailure": "block"` Claude Code refused the call. Such a command is now decided in seconds. A path longer than 32,768 characters still has its symlinks resolved, now a stretch at a time, so `cat H/.ultracode-goal/recall/` followed by a glob of 33,000 `*`, with `H` a link to the home folder, and `mkdir -p` through a linked folder past that length are still refused. As before, at any length, the guard does not follow a link the shell reaches through a glob (the `[H]` or `?` in `[H]/.ultracode-goal/recall/*`, or a glob over a folder that holds the link), through a brace group in a word longer than 1,024 characters, which it reads as a glob, or by a `..` that climbs back over a link (`L/../recall`), and SECURITY.md now lists these among its limits.
