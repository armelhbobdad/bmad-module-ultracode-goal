type: fixed
scope: ultracode-goal
summary: |
  Under `--profile production`, `gate_eval.py` now reads the test review's own Quality Score and Recommendation and the NFR audit's own Overall Status from the lines that carry those labels, instead of taking the first match anywhere in the file. Before, a `test-review.md` that quoted an earlier score or an earlier `Approve` above its own result, or an `nfr-assessment.md` that quoted an earlier status above its own, was judged on the quoted value: a review that scored its tests 62 but opened by quoting a previous 91 returned `advance`. A line counts when it opens with `Quality Score`, `Recommendation`, `Overall Status` or `overallStatus`, after any indentation and list, quote, heading or emphasis marks, followed by its value, which is how TEA writes them. A leading number or date before the label counts too, so a dated line such as `2026-11-20 Quality Score: 72/100` beside the review's own different score fails the signal. One distinct Quality Score on such lines is the score; two or more different ones fail the signal with a `reasons` line that names them and the file, and `review_score` prints `null`. `Block` on any such line is `Block`. The NFR status is the most severe value on such lines, in the order `FAIL`, `NOT_ASSESSED`, `CONCERNS`, `PASS`. When such lines disagree on the Recommendation or the Overall Status, a `reasons` line names the values and the file and says which one is read. The gate stage's hand-authored shapes now say to write each field once, at the start of its own line, and to quote an earlier value only inside a sentence. A file with no such line is read as before, each signal on its own, so a hand-written review keeps its reading, and TEA's own reports read as they did. `operator_owed.py`, which reads the same signals, reads them the same way. The threshold of 80, the printed keys and every flag are unchanged.
