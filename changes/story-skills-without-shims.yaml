type: breaking
scope: ultracode-goal, ucg-formalize, installer
summary: |
  UCG now ships its own story skills, `ucg-create-story` and `ucg-dev-story`, adapted from BMAD Method's `bmad-create-story` and `bmad-dev-story`, which BMAD 6.12 made opt-in shims and v7 removes. A run delegates story creation and implementation to them, so a BMAD install made without shims (the BMAD installer's recommended answer) runs UCG as it is, and `--shims` is no longer needed. UCG's installer copies both skills beside `ultracode-goal`; the plugin-marketplace entry still ships `ultracode-goal` alone. Preflight's blocker for a missing story skill is now `story_skills`: it names `ucg-create-story` and `ucg-dev-story`, its fix is `npx bmad-module-ultracode-goal update` (or `install`), and BMAD's own shims no longer satisfy it. Preflight's report reads `checks.story_skills` in place of `checks.bmad_skills` and drops `checks.bmad_install`. A team override written for BMAD's skills no longer reaches a UCG run.
migration: |
  Run `npx bmad-module-ultracode-goal update` in the project to install the two story skills, or `npx bmad-module-ultracode-goal install` if UCG reached the project only through the plugin marketplace, which ships neither. If you customized BMAD's story skills for UCG runs in `_bmad/custom/bmad-create-story.toml` or `_bmad/custom/bmad-dev-story.toml`, copy those entries to `_bmad/custom/ucg-create-story.toml` or `_bmad/custom/ucg-dev-story.toml`, which UCG's skills read the same way.
