type: breaking
scope: ultracode-goal, ucg-formalize, installer
summary: |
  UCG now ships its own story skills, `ucg-create-story` and `ucg-dev-story`, adapted from BMAD Method's `bmad-create-story` and `bmad-dev-story`, which BMAD 6.12 made opt-in shims and v7 removes. A run delegates story creation and implementation to them, so a BMAD install made without shims (the BMAD installer's recommended answer) runs UCG as it is, and `--shims` is no longer needed. A run passes both skills its own `implementation_artifacts` folder, which they use in place of BMAD's, so the story files and the `sprint-status.yaml` rows they touch are the ones the run reads, even when the two folders differ (a customized folder, or an isolated track). They run BMAD's `resolve_config.py` and `resolve_customization.py` with `uv run --no-project`, so in a Python project uv does not set up the project's own environment (a `.venv` and a `uv.lock`) for them. UCG's installer copies both skills beside `ultracode-goal`; the plugin-marketplace entry still ships `ultracode-goal` alone. `npx bmad-module-ultracode-goal status` now checks every skill UCG installs, not only `ultracode-goal`, and names each one that is missing from `_bmad/ucg/` or `.claude/skills/` or differs from the package. Preflight's blocker for a missing story skill is now `story_skills`: it names `ucg-create-story` and `ucg-dev-story`, its fix is `npx bmad-module-ultracode-goal update` (or `install`), and BMAD's own shims no longer satisfy it. Preflight's report reads `checks.story_skills` in place of `checks.bmad_skills` and drops `checks.bmad_install`. A team override written for BMAD's skills no longer reaches a UCG run.
migration: |
  Run `npx bmad-module-ultracode-goal update` in the project to install the two story skills, or `npx bmad-module-ultracode-goal install` if UCG reached the project only through the plugin marketplace, which ships neither. If you customized BMAD's story skills for UCG runs in `_bmad/custom/bmad-create-story.toml` or `_bmad/custom/bmad-dev-story.toml`, copy those entries to `_bmad/custom/ucg-create-story.toml` or `_bmad/custom/ucg-dev-story.toml`, which UCG's skills read the same way.
