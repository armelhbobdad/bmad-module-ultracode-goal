type: fixed
scope: ultracode-goal
summary: |
  In production, the files a tool wrote when it measured the commit under assessment now reach TEA's NFR assessment. The assessor audits the gate worktree, and TEA's NFR audit takes evidence only from files under the root it audits, while those results files, reports, scans and logs are written in the main tree, so a breach recorded only there never reached the audit and could read `CONCERNS`, which does not fail the gate's AND, and let the story `advance`. Before each NFR assessment, the run now copies each such file into the gate worktree, untracked and not as a link, under a `.ucg-measured/` folder it names to the assessor, where each file keeps its path relative to the project root, so two files of one name do not overwrite each other. It copies them after the cycle's rebuild of the worktree when it has one, since the rebuild would discard them, and the worktree's removal once the verdict is recorded discards them too. `gate_eval.py` is unchanged, so a given `nfr-assessment.md` returns the verdict it returned before.
