type: fixed
scope: ultracode-goal, ucg-resolve
summary: |
  When the operator answers an `operator-evidence-owed` escalation by moving a criterion tagged `**Gate-ability:** operator-evidence` out of the story in writing, the re-gate now leaves that criterion out instead of re-looping the story. Before, nothing said what the move looked like in the story file, so TEA's trace still scored the criterion (`NONE`), the gate read `FAIL` or `CONCERNS`, and `operator_owed.py` read `owed: false`, which sent the story to a re-loop with nothing to build. The moved criterion now leaves the story's numbered list for a section of its own after `## Acceptance Criteria` that names its retired number, its owner and the ruling, with no `**Gate-ability:**` text in it. Its number is never reused, no other criterion is renumbered, and it leaves the ATDD checklist's `acceptanceCriteria`. `/ucg-resolve` closes on a move only once the story file carries that form, and writes the move into a per-story `.moved-<story_id>` record, which every later gate cycle, the commit of the gate's evidence and a resume read, and which the advance route retires once that commit is made. A later written return of the criterion undoes the form and takes its line out of the record. A decomposed child's criterion is not moved this way, since its parent's story file is never edited: `/ucg-resolve` records `defer` and proposes a re-plan of the split. Every gate cycle of a story with that record moves the previous trace files aside, names the main-tree story file, and every recorded oracle source, to trace, and before `gate_eval.py` runs, the new `moved_ac_check.py` reads TEA's coverage matrix as `operator_owed.py` does, checked against the full sha of the commit under assessment (40 or 64 hex digits, never a prefix): while a row still holds a moved criterion, or the trace files cannot be read or measured another commit, the story escalates `operator-evidence-owed` again and is never re-looped. That escalation's decision opens with `The moved-AC check refused` and its exit code, names the run, the refusal's number, the commit and what must change, and `/ucg-resolve` closes it only once the operator confirms the sources trace still read no longer list the criterion, or returns it, or, when trace only has to run again, at once the first time at that commit and on the operator's written confirmation after that. A passed check leaves the gate's routes as they were. Open `gate-gap:` lines on a moved criterion become owned by its owner. On `advance` or `defer` the story adds one `med` deferred-work row per moved criterion, naming its owner and those lines. The story file, its checklist and the edited sources are committed with the gate's other files once the story advances.
