type: breaking
scope: ultracode-goal
summary: |
  UCG now requires `Claude Code` 2.1.295 or later, up from 2.1.154, and preflight's non-remediable `cc_version` blocker refuses to launch below it, naming `hook-onFailure>=2.1.295` and reporting `checks.hook_onfailure_ok`. Preflight now arms the `PreToolUse` guard's hook item with `"onFailure": "block"`, which 2.1.295 added: when the guard cannot start (`uv` missing from `PATH`, say), crashes, exits with a code other than 0 or 2, or times out, Claude Code refuses the tool call instead of letting it run unchecked. Under the all-tools matcher a guard that cannot run refuses every tool call, Read included, so its cause is fixed from outside the session; Troubleshooting has a new entry, "Every tool call is refused", for that. The `Stop` budget hook carries no `onFailure`. `preflight_check.py --assert-armed` now fails unless every guard item carries `"onFailure": "block"` exactly, reporting `checks.hooks.guard_on_failure` and a reason that names what it found, and a resume answers that reason by re-merging the hooks in place, purging nothing, then asserting again.
migration: |
  Update `Claude Code` to 2.1.295 or later (`claude update`; `claude --version` shows the version), then start or resume the run as before. The next preflight re-arms the guard with the setting. A run already in flight re-arms on its next resume, which finds the guard item without it, re-merges the hooks and asserts again before it drives a story. That resume writes `.claude/settings.local.json`, which a headless session cannot approve, so make it attended (not `-H` or `drive_epic.py`); a headless resume stops at that write and names it. Keep `uv` on the `PATH` Claude Code runs hooks with: from now on a guard that cannot run refuses every tool call.
