type: fixed
scope: ultracode-goal
summary: |
  On a re-loop that a failed production signal caused, a finding that one of the story's acceptance criteria prescribes is no longer fixed when it comes from the signal that did not fail. Under `--profile production`, `gate_eval.py` downgrades an `advance` to `reloop` when the test review scores below 80 or says `Block`, or the NFR assessment reads `FAIL`, and the other signal can pass beside it: a test review that scored 80 or more without a `Block`, or an NFR assessment that read `PASS` or `CONCERNS`. The gate read only the failed signal's findings against the story's criteria, so a finding on a passing test review went to the generalize step, where it could get a `class:` line and a fix that breaks the criterion. The gate now reads the findings of a signal that did not fail against the criteria too (a passing test review's violations, a passing NFR assessment's `CONCERNS` criteria), names each prescribed one in the re-loop's `.decision-log.md` entry, writes no `class:` line for it and leaves it unfixed. Only the failed signal's findings decide the `ac-amendment-needed` escalation, as before, so a prescribed finding on a signal that did not fail stops no story. `gate_eval.py` is unchanged.
