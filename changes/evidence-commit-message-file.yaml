type: fixed
scope: ultracode-goal
summary: |
  The gate's evidence commit now takes its message from a file, as the story's own commits and the backfill commit do: the conductor writes it with Write to `{workflow.implementation_artifacts}/.scratch-<story_id>/message.txt` and commits with `git commit -F`, and a `commit-msg` rejection is answered by rewording that file. Before, the gate named no message file, so the message went inside the Bash command. After a double-quoted `-m`, bash ran a backticked name or a `$(...)` in it as a command (in a reproduction, a backticked `git push` ran) and the commit still exited 0 with the text that was left, so the committed message could differ from the one written while the exit status showed nothing. A quoted heredoc keeps the text, but the guard reads its lines as commands, and the `$(cat <<'EOF' ...)` form is a command substitution a harness that reads Bash strings statically refuses, so the gate now bars every inline form and says why. The scratch folder is removed again once the commit is made or its escalation is written, and a resume that makes an owed evidence commit writes the file again, Reading it first if an earlier session left it.
