type: fixed
scope: ultracode-goal, ucg-formalize
summary: |
  The readiness check (`formalize_check.py`) reads acceptance criteria and story keys as the docs describe them. A wrapped line that begins with a number, or a nested numbered list, no longer splits one acceptance criterion in two, so the first half no longer reports a missing verification and a missing twin it has. The `story_keys_uncovered` gap now compares a story key's whole id with its file's, so a key such as `95-0-a-i` or `94-7-b-1` is no longer read as covered by another story's file, and a letter-suffixed key such as `94-2a` is covered by its own file. A decomposed child stays covered by its parent's file when the parent row is `done` or was removed by the split; under a parent row that is still open, it is now reported.
