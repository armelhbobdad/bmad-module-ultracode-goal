type: fixed
scope: ultracode-goal, ucg-formalize
summary: |
  The readiness check (`formalize_check.py`) reads acceptance criteria and story keys as the docs describe them. A wrapped line that begins with a number, or a nested numbered list, no longer splits one acceptance criterion in two, so the first half no longer reports a missing verification and a missing twin it has. The `story_keys_uncovered` gap now compares a story key's whole id with its file's, so a key such as `95-0-a-i` or `94-7-b-1` is no longer read as covered by another story's file, and a letter-suffixed key such as `94-2a` is covered by its own file. That file is also no longer reported as a leaked TEA artifact when its title carries a TEA word (`3-2a-trace-export.md`), where moving it out of the story folder left the key uncovered. A decomposed child stays covered by its parent's file when its row sits above the parent's row and the parent row is `done`, where the decomposition conventions put it, or when the split removed the parent's row. Under a parent row that is still open, or below a `done` parent's row, it is now reported, so a lettered story such as `3-2a`, added after `3-2` shipped and still without a file, no longer reads as covered.
