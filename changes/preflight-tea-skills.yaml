type: breaking
scope: ultracode-goal
summary: |
  Preflight now refuses to launch when a TEA skill the run's profile delegates to is not installed where Claude Code loads skills, so a project that launched before can now stop at preflight. The new `tea_skills` blocker is non-remediable: production needs all eight `bmad-testarch-*` skills, and `--light` needs `bmad-testarch-framework`, `bmad-testarch-test-design` and `bmad-testarch-trace`. `preflight_check.py` takes `--profile production` or `--profile light` to pick that set (production by default) and reports `checks.tea_skills`. The blocker's detail names the missing skills and says UCG supports BMAD 6 with TEA 1.27.x, which BMAD Method 6.12.2 and later install. When `bmad-tea-*` skills are installed instead, it says the project looks like TEA 3.0 or later, which renamed them and which UCG does not support yet. The check reads skill names, not the TEA version, so it does not catch TEA 2.x, which kept the old names. The README, the prerequisites table, Getting Started and Troubleshooting now state that supported range.
migration: |
  If preflight now stops on `tea_skills`, install TEA 1.27.x from the project root with BMAD Method 6.12.2 or later (`npx bmad-method install`, with the `tea` module selected), so its `bmad-testarch-*` skills land in `.claude/skills/`. A TEA installed some other way, such as a Claude Code plugin, does not count: the check looks only in the project's `.claude/skills/` and your personal skills folder. A project on TEA 2.0 or later, or on BMAD 7, cannot run UCG yet.
