type: fixed
scope: ultracode-goal
summary: |
  Where no test runner can execute the code a gap sits in (a constructor that needs a live host-framework object, say), `bmad-testarch-automate` can backfill a test that only reads that code's source text, and the gate read the mutation rows that test kills as the gap closed, though no test ran the behaviour. Such a test now measures the spelling only: it is still committed with the backfill, and the gate logs an `unmeasured` `gate-gap:` line for the behaviour that names the test and what could execute the code (a mock of the runtime, a real build). Automate's summary says beside each test whether it executes the code or reads its source text, and the gate also reads each backfilled test, taking one whose text names the mutated file beside a read form (such as `open(`, `read_text`, `read_to_string`, `readFile`, `readFileSync`, `os.ReadFile`, `include_str!`, `include_bytes!`, `?raw` or a parse of the source), or that reads the code by its object as `inspect.getsource` does, as one that reads source text. Automate is told to name each test that executes the code so that no such test's name contains it. A row in a file such a test reads counts as killed only as `KILLED` or `KILLED+others` with an `expect_red` that names a test that executes the code, so no test that reads source text, the backfilled one or a later one, ever closes that line, and no later pass writes another such test for it. Each pass logs the line afresh at its own commit, and like every open `gate-gap:` line it becomes a `med` deferred-work row once the story advances or is deferred, whose reason names the test and whose suggested action names what could execute the code.
