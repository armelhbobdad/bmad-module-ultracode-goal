type: fixed
scope: ultracode-goal
summary: |
  `preflight_check.py --assert-armed` now reads a UCG hook command's options as `uv` reads them. A command whose `uv run` carries an option with a value (`uv run --python 3.12 '<script>'`, or `-p 3.12`) passes as one that starts its script. It read the option's value as the script, reported the command in `checks.hooks.command_problems`, and a resume then rewrote it to the form preflight writes. A command `uv` would refuse fails, and the problem names why: an option before `run` other than uv's global ones (`uv --python 3.12 run '<script>'`, or `uv -- run '<script>'`), an option uv does not take where it stands (`uv run --bogus '<script>'`, which it passed before), a value given to a flag, an option given twice in one place, two options uv refuses together, in one place or one before `run` and one after it (`uv --offline run --no-offline '<script>'`), a value outside the set uv takes for an option such as `--color` or `--link-mode`, a `--max-recursion-depth` that is not a whole number uv takes, or an empty value for an option `uv` takes none for (`uv run --package '' '<script>'`, or `-C=`). So does a command with `--frozen` or `--locked` (`uv run --frozen '<script>'`, which it passed before): `uv` then looks for a lockfile beside the script, which preflight never writes. A Python request fails when it admits a Python below the 3.11 minimum the hook script's header sets (`uv run --python 3.10 '<script>'`, `-p 3`, `-p=3.10`, `--python 'cpython 3.10'`, or `--python '<3.12'`), since `uv` runs the script on the Python a request selects with only a warning, while `--python 3.12` and `--python '>=3.11'` pass. Values in other forms, such as a path, a URL, a requirement or a Python named by its path, are not judged. A command that would run a module (`uv run -m`, which it passed before) fails, and the problem names it. So does one where `uv` would print its version, its help or its settings and exit without running the script (`uv run --help '<script>'`, which it passed before): such a guard never runs, and Claude Code reads its exit 0 as no objection to the call. A command that hands the script to a Python (`uv run python '<script>'`, or `python3.12`) still fails, and the problem now says why: `uv` then runs the script without reading its inline metadata, so the Python minimum the script sets does not hold, and the script runs in the project's environment, where there is one, instead of an isolated one. A resume rewrites each of these to `uv run '<script>'`. The reason that lists these problems now opens with `UCG hook command would not run its script as preflight writes it` and says what each kind costs: it said Claude Code skips a budget hook that cannot start without a word, while a budget command `uv` refuses sends each stop back with uv's error, up to eight times in a row, unless the project `uv` syncs first fails to build or resolve, when `uv` exits 1 and each stop goes through uncounted.
