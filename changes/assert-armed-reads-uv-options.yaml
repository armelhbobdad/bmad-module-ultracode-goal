type: fixed
scope: ultracode-goal
summary: |
  `preflight_check.py --assert-armed` now reads a UCG hook command's options as `uv` reads them. A command whose `uv run` carries an option with a value (`uv run --python 3.12 '<script>'`, or `-p 3.12`) passes as one that starts its script. It read the option's value as the script, reported the command in `checks.hooks.command_problems`, and a resume then rewrote it to the form preflight writes. A command `uv` would refuse fails, and the problem names why: an option before `run` other than uv's global ones (`uv --python 3.12 run '<script>'`, or `uv -- run '<script>'`), an option uv does not take where it stands (`uv run --bogus '<script>'`, which it passed before), a value given to a flag, an option given twice in one place, two options uv refuses together, a value outside the set uv takes for an option such as `--color` or `--link-mode`, or a `--max-recursion-depth` that is not a whole number uv takes. Values `uv` checks in other forms, such as a path, a URL, a requirement or a Python version, are not judged. A command that would run a module (`uv run -m`, which it passed before) fails, and the problem names it. So does one where `uv` would print its version, its help or its settings and exit without running the script (`uv run --help '<script>'`, which it passed before): such a guard never runs, and Claude Code reads its exit 0 as no objection to the call. A command that hands the script to a Python (`uv run python '<script>'`, or `python3.12`) still fails, and the problem now says why: `uv` then runs the script without reading its inline metadata, so the Python minimum the script sets does not hold, and the script runs in the project's environment, where there is one, instead of an isolated one. A resume rewrites it to `uv run '<script>'`.
