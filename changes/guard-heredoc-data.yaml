type: fixed
scope: ultracode-goal
summary: |
  While a run latch is present, the `PreToolUse` guard no longer refuses a Bash command for the text of a heredoc body it can tell bash only hands to `cat` or `tee` as data. A report appended with `cat >> <file> <<'EOF'` was refused as naming the run latch when its markdown read as a glob that matches the latch (`row 6).**` from the latch's own folder), or as naming the recall store when it quoted the store's path. It now passes, also when later lines count the report or pipe a `git status` into `wc -l`. The latch and store rules now leave out such a body when its delimiter is quoted, and of one whose delimiter is not, they read only each `$(...)`, `$((...))`, `${...}`, `$[...]` and backtick, which bash runs. The body counts as data only when a bare `cat` or `tee` leads its simple command (after plain assignments, with no keyword, `{`, `!` or redirection in front), no pipe follows that command in its pipeline, and nothing before it changes the environment or command lookup (an assignment included); after a group, subshell, loop or function opens, a pipe or such a change anywhere in the command keeps the body too. Every other body is still read as commands: for example, one fed to another command (`bash`, `python3 -`, `xargs`, `source /dev/stdin`), every body of a command with a `<(` or `>(` outside its heredoc bodies, and every body of a command whose heredocs the guard cannot read the way bash does (such as one inside `$(...)`, a command with a `case`, an unquoted body with a line ending in a backslash, or a body with no delimiter line). A mention of `.claude-mem` is still refused in any body. A body that `cat` or `tee` writes to a file is no longer read, even when the same command then runs that file, so one Bash call can now do through a written file what the file tools already could; `SECURITY.md` lists this with the other indirection limits, and the exact conditions.
