type: added
scope: ultracode-goal, ucg-resolve
summary: |
  A story whose acceptance criterion owes evidence only a person can produce, such as a measurement on a release build, no longer fails its gate with no way forward. Define-Done splits such a criterion: its machine-checkable half stays one criterion, and the operator half becomes its own criterion tagged `**Gate-ability:** operator-evidence`, proven by a record in TEA's live verification results file and given no red-phase scaffold. A criterion that asks for nothing to be built or changed, whose whole content is a measurement, run or observation a person makes and records, is retagged `operator-evidence` in place. A criterion that asks for a change (code, a comment, a doc, a ledger edit) keeps its tag even when only a person's read can check it. A story written before this release whose operator-evidence criterion still carries the plain tag keeps the re-loop until that criterion is retagged. A plain `**Gate-ability:** operator` tag keeps its meaning, work the dev agent builds that a person or a script verifies, and is never read as owed evidence. When a gate reads `FAIL` and the only criteria TEA's coverage matrix holds open are `operator-evidence` ones, which the new `operator_owed.py` checks (anything it cannot read keeps the re-loop), the run stops with an escalation of kind `operator-evidence-owed` instead of re-looping a story no fix can change. That escalation names the criteria, the commit and the file to record into. `drive_epic.py` reports the stop as a handoff, and `/ucg-resolve` closes it only once a `pass` record for each criterion is on disk at that commit. That close writes a `.regate-<story_id>` marker naming the commit and resets the story's turn counter, and while the commit is still `HEAD`, `preflight_check.py --assert-armed` routes the story `gate-owed`, so the resume re-gates that commit instead of re-driving the story; a later commit makes the marker stale. The re-gate counts the records, and TEA caps a criterion covered only by recorded evidence at `CONCERNS`, so the story defers and advances. An `operator-evidence` criterion that already has a counted `pass` record, which TEA still holds below `FULL`, is still owed: the record covers only part of it, so the escalation names the records already counted and asks the operator to record the rest or to narrow or move the criterion in writing, and `/ucg-resolve` closes it only on a new `pass` record or that written change, never on the records already counted. An `operator-evidence` criterion still owed when the story advances or defers, as an uncovered P2 or P3 one may leave it, gets a deferred-work row naming the evidence still owed. It still counts toward TEA's overall coverage, so it can also fail the gate, and that `FAIL` goes through the same `operator_owed.py` check. Execute now also says to get a criterion narrowed in writing, through an escalation, before committing a test that pins behaviour the criterion forbids.
