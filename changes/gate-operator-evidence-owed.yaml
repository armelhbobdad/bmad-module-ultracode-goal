type: added
scope: ultracode-goal, ucg-resolve
summary: |
  A story whose acceptance criterion owes evidence only a person can produce, such as a measurement on a release build, no longer fails its gate with no way forward. Define-Done splits such a criterion: its machine-checkable half stays one criterion, and the operator half becomes its own criterion tagged `**Gate-ability:** operator`, proven by a record in TEA's live verification results file and given no red-phase scaffold. When a gate reads `FAIL` and the only criteria TEA's coverage matrix holds open are operator-tagged ones, which the new `operator_owed.py` checks (anything it cannot read keeps the re-loop), the run stops with an escalation of kind `operator-evidence-owed` instead of re-looping a story no fix can change. That escalation names the criteria, the commit and the file to record into. `drive_epic.py` reports the stop as a handoff, and `/ucg-resolve` closes it only once a `pass` record for each criterion is on disk at that commit. The re-gate counts the records, and TEA caps a criterion covered only by recorded evidence at `CONCERNS`, so the story defers and advances. An operator criterion that does not fail the gate, at P2 or P3, gets a deferred-work row naming the evidence still owed when the story advances or defers. Execute now also says to get a criterion narrowed in writing, through an escalation, before committing a test that pins behaviour the criterion forbids.
