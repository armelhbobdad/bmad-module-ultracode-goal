type: docs
summary: |
  The knowledge-graph refresh page, the security policy and the Finalize step's own description now match graphify 0.9.92. A new `.gitignore` or `.graphifyignore` rule does not make graphify refuse the refresh, as the page used to say: the newly ignored files are pruned like a deletion and the refresh exits 0, and a `.gitignore` rule never reaches files git already tracks. The page also says how to build the first graph (`/graphify .` in your AI assistant, or `graphify update .` offline for the parsed layer alone), which files the refresh parses, and that it makes no network request unless graphify's Google Workspace export is on.
