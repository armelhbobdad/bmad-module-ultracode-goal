type: docs
summary: |
  The knowledge-graph refresh page, the security policy and the Finalize step's own description now match graphify 0.9.92; what the refresh does is unchanged. A new `.gitignore` or `.graphifyignore` rule does not make graphify refuse the refresh, as the page used to say: the newly ignored files are pruned like a deletion and the refresh exits 0, and a `.gitignore` rule never reaches files git already tracks. The page also says how to build the first graph (`/graphify .` in your AI assistant, or `graphify update .` offline for the parsed layer alone), which files the refresh parses, that it makes no network request unless graphify's Google Workspace export is on, and that graphify's own housekeeping can write outside `graphify-out/` unless `GRAPHIFY_NO_AUTO_REFRESH=1` is set: after a graphify upgrade it re-copies the skill files `graphify install` put in your home directory (for Claude Code, `~/.claude/skills/graphify/`), and on any run it can replace an outdated graphify OpenCode plugin under `.opencode/`.
