type: docs
summary: |
  The security policy now names a limit no guard invariant can close: a Claude Code mod you install that handles the `tool.check` event can approve a call the `PreToolUse` guard denied, or one a deny rule refuses, unless the machine has managed settings or the session's credential is a Team or Enterprise `/login`. Mods run under `claude -p` too, so review every installed mod before a UCG run. The policy also says that each `allowlist_commands` entry allows anything after it, so the default `uv run` entry lets any program run through `uv run` without a prompt.
