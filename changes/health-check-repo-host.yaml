type: fixed
scope: ultracode-goal
summary: |
  The health check now files on a `health_check_repo` written `HOST/OWNER/REPO`, a repository on a host other than github.com such as a GitHub Enterprise Server host. A new `health_check_fp.py repo` call splits the value into the host it names, as `gh` reads it (`github.com` for `OWNER/REPO`), and its `OWNER/REPO`, and the health check runs it once before its review gate. Its check of the `gh` login now looks at that host alone, so a stale login on another host no longer stops it; its upvote on a matching issue, which a comment also makes first, reaches that host instead of failing on github.com; and the issue-form link it gives for a finding saved to the local queue, like the one on the Health Check page, points at that host instead of a github.com page that does not exist. The gate calls the issues public only for the default repository on github.com. When the `repo` call fails or refuses the value, every finding the run would post goes to the local queue with the reason "Posting these to GitHub failed." and no issue form is linked. Log in to the host first with `gh auth login --hostname HOST`, HOST in lower case and without a leading `www.`.
