type: fixed
scope: ultracode-goal
summary: |
  The run latch, `.mem-state.json` in the implementation artifacts folder, no longer reaches git on a project that tracks that folder. `mem_recall.py latch`, which every run calls at Stage 1 with recall on or off, now adds a line for the latch, `/<artifacts folder>/.mem-state*`, to the repository's `.git/info/exclude`, a local file git never commits; it is anchored to that folder, so no other file is hidden. Before, the latch showed as an untracked file, so preflight's `git_clean` check read the tree as dirty because of UCG's own file, a `git add -A` that cleared the tree committed the latch, and removing it at the run's end then left a tracked deletion for the next run's `git_clean` to trip on. A latch git already tracks still shows as a change, so `latch` now prints `NOTE recall-latch-visible` naming it, which the run report carries; untrack it once by hand, from a terminal of your own once no run is active (the guard denies a command that names a present latch), with `git rm --cached` and commit that. The same NOTE says when the exclude file could not be written.
