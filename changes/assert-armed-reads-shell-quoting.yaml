type: fixed
scope: ultracode-goal
summary: |
  `preflight_check.py --assert-armed` now reads a UCG hook command's quotes and operators as the shell does, and fails one that holds anything the shell would expand first. A leading `KEY=value` word counts as an assignment only when its name and its `=` are unquoted, so a command that quotes the name with its value (`'KEY=a b' uv run '<script>'`, `"KEY=a b"`, or `KEY"=v"`) fails, and the problem says the shell would run that word as the command: the shell exits 127 there, so the guard refuses every tool call and the budget hook counts no turn, while the check passed it and reported the hooks as armed. `KEY='a b' uv run '<script>'`, the form preflight writes, and an unquoted `KEY=value` with no space still pass. A command that holds a shell operator or redirection outside quotes, before the script or after it, also fails, and the problem names it: `< /dev/null` or `&` hands the script no hook event, `> /dev/null` or `2>&1` sends its verdict or its reason elsewhere than where Claude Code reads it, and `|| true` or `; true` hands Claude Code another command's exit code. The check passed each of these. A command that holds a `$` or a backtick outside single quotes (`uv run '<script>' "$(cat)"`, `KEY="$HOME"`), or a `*`, `?`, `[` or `{` outside quotes (`uv run --with * '<script>'`), fails too, and the problem names it, since the shell expands it before `uv` starts: `"$(cat)"` reads the hook event before the script can, so the guard reads no event and allows the call, `KEY=${A:- uv run '<script>' }` is one assignment, so nothing runs, and `--with *` can hand `uv` a file in the hook's folder as the script. The check passed these too. A resume rewrites each to the form preflight writes, and step 5's Hooks bullet now says to quote a value alone, never its name with it.
