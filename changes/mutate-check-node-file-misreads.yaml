type: fixed
scope: ultracode-goal
summary: |
  `mutate_check.py` reads five more kinds of Node test runner output right. In each, a test file the mutant stopped loading, or whose process exited non-zero after the row's own test passed, read as a kill, where the gate's reference says such a mutant reads 0 failed, a row that cannot run, and now it does. When a task runner runs `node --test` in several packages at once and prints their lines as they come (turbo outside CI, `pnpm -r` without `--aggregate-output`), another package's lines or run summary could land among the file's, so the row read as a kill in some runs and not in others; each package's lines are now read apart, by the prefix the task runner puts on them. When two runs in one command each failed a file of the same name, as two workspaces' `test/index.test.mjs` do when a mutant in a module both import stops them loading, only the first was read. Under `--test-reporter=tap`, which writes `#` as `\#` and a backslash as `\\` in a name, a file name that holds `#` was not matched. Nor was a file outside the folder node runs in, which TAP names by a relative path (`../shared/a.test.mjs`) and locates by an absolute one, or a file whose name holds a quote mark (`it's.test.mjs`), whose location TAP then writes in double quotes or backticks, or with `\'`. A test name that holds `#` or a backslash was matched only as the reporter that ran wrote it; it is now matched both as TAP writes it and as the spec reporter prints it, so a row that names its test either way reads 0 failed when the test's file fails after the test passed, or because a timer the test started threw after it ended. Output in which two runs' lines interleave with no prefix to tell them apart can still read such a mutant as a kill, and so does a module that calls `process.exit` while its test file loads, or kills its process then by filling the heap or by a signal, which Node reports as it reports a process that exits or crashes during the file's first test. The gate's reference now says both, and the gate tells automate to write no replacement that makes a module exit, fill the heap or raise a signal while a Node test file loads.
