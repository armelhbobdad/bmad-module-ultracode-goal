type: fixed
scope: ultracode-goal
summary: |
  Define-Done no longer runs the story-creation skill for a decomposed child, which by the decomposition conventions has no story file and must never get one. For a key the readiness check lists in `checks.decomposed_children` whose split is recorded, it runs ATDD under the child's own key, reading the parent's story file for the parent acceptance criteria the child's row claims, so the checklist is the child's and the parent's file is left unedited. A listed key with no record of a split gets its own story file, and the decision log notes that the readiness check never read its criteria. Execute then hands `ucg-dev-story` the child's key, the parent's story file and the parent acceptance criteria the child's row claims, in place of a story path, and on a re-loop the gate's reasons and the review findings that sent the child back: it implements only those criteria, with the parent's Dev Notes as guidance, writes no story file, checks its definition of done against those criteria and its own summary, and moves only the child's row, to `in-progress` and then `review`, so the parent's row stays `done`. The File List and completion notes it gives in its summary are what the pre-commit claim check reads for the child.
