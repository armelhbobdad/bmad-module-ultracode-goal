type: fixed
scope: ultracode-goal
summary: |
  Define-Done no longer runs `bmad-create-story` for a decomposed child, which by the decomposition conventions has no story file and must never get one. For a key the readiness check lists in `checks.decomposed_children` whose split is recorded, it runs ATDD under the child's own key, reading the parent's story file for the parent acceptance criteria the child's row claims, so the checklist is the child's and the parent's file is left unedited. A listed key with no record of a split gets its own story file, and the decision log notes that the readiness check never read its criteria.
