type: fixed
scope: ultracode-goal
summary: |
  While a run latch is present, the `PreToolUse` guard now counts more ways a Bash command can change what a later command resolves to, so a command that rebinds `cat`, `uv`, or `python` no longer passes as a read of the latch or keeps the recall-script exemption. It already caught a plain `NAME=` assignment, `export`, `source`, `hash`, `alias`, `eval`, a function definition, and arithmetic such as `((...))`; it now also counts a `${...}` whose operator assigns (`${BASH_CMDS[cat]:=/bin/rm}`, `${!x:=...}`), an assignment, `++`, or `--` where bash evaluates arithmetic (a `[[ ... ]]` test that compares numbers, a `${...}` substring's offset or length, and a subscript in a `${...}`, in a word that assigns to it, or in a `-v` test, as in `[[ 1 -eq PATH=1 ]]`, `${PWD:PATH=1}`, `${a[PATH=1]}`, and `test -v 'a[PATH=1]'`), an assignment to an interpreter or path variable whose value opens a `$(...)` or backtick (`PATH=$(printf %s /x):$PATH`), a rebinding builtin behind `command` and an assignment behind `time` (`command export PATH=...`, `time PATH=...`), and an assignment word whose subscript nests or holds blanks (`PATH[a[0]]=...`, `PATH[ 0 ]=...`). It also counts any mention of `BASH_CMDS` or `BASH_ALIASES`, since a command whose name the text does not spell can write an entry, so a read of the latch in a command that only mentions them (`grep BASH_CMDS <latch>`) is refused too. So a command such as `: ${BASH_CMDS[cat]:=/bin/rm}; cat <latch>` is now denied where it passed before, while a `=` later in a `${...}` (`${PWD#*=}`, `${x:-a=b}`) and a bracket that is no subscript (`grep 'a[b=c]' <latch>`) still pass. `SECURITY.md` lists what counts as changing command lookup, and what the guard still cannot see because it reads text: a command name built at run time, and a value that only reaches arithmetic at run time (`set -- PATH=1; [[ $1 -eq 1 ]]`).
