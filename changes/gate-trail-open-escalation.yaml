type: fixed
scope: ultracode-goal
summary: |
  The gate trail (`gate-trail.md`) now shows `escalate` for a story whose escalation is still open, and its verdict-source line names the `escalation-<story_id>.json` sidecar and its `kind`. Before, it showed the verdict the story escalated from: a story the gate escalated as `operator-evidence-owed`, or stopped at its turn ceiling, read `reloop` on every row, as if it owed a code fix rather than an operator's record. A story with an open escalation and no gate artifact now reads `escalate` too, where it read `n/a`, as `gate_eval.py` would return for it. Open means what a resume reads: the sidecar is on disk, `/ucg-resolve` has not closed it, it is not a handoff, and the story's `sprint-status.yaml` row is not `done`, so a sidecar left beside a story that later advanced changes nothing. An `evidence-commit-rejected` escalation `/ucg-resolve` has not closed keeps the verdict the story advanced on (`advance`, or `defer`), whatever its row reads, since only its evidence commit is owed, and the verdict-source line names it.
