type: added
scope: ultracode-goal
summary: |
  Execute now checks a story's record before its commit. Between staging and the commit, the run writes the commit message to the story's scratch folder and runs the new `claim_check.py`, which lists the paths the message names that the staged diff does not touch: each is staged, or the message is reworded so it does not say this commit changed it. The run then reads the claims the diff itself adds (new comments, headers and completion notes) and each message line for a superlative or a property claim, and either cites evidence the cycle already produced or softens it to what that evidence shows, so an overstated record is caught before the commit rather than by a review after it.
