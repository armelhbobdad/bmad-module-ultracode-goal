type: added
scope: ultracode-goal
summary: |
  Execute now checks a story's record before its commit. Between staging and the commit, the run writes the commit message and the story-record notes the cycle added to the story's scratch folder and runs the new `claim_check.py --message <message> --message <notes>`, which lists in `not_in_diff` the paths either text names that the staged diff does not touch (the record can name a file the message only describes), with paths git ignores listed apart in `ignored`. Each listed path is staged, or the claim is corrected: an edit with no change in the work tree did not happen. The run then makes one pass over the claims the diff itself adds and each message line: it finds the staged hunk for each edit the texts say the commit makes, path or no path; it backs each superlative or property claim with evidence the cycle already produced or softens it to what that evidence shows; and it corrects a forward reference elsewhere in the tree ("does not exist yet") that the commit makes false. An overstated record is caught before the commit rather than by a review after it. When the project root is a folder below the git top level, the check reads a named path from the project root (`src/a.py`) or from the top level (`app/src/a.py`). Stdin and the JSON are UTF-8 on any console, so a Windows code page or a staged file name that is not UTF-8 never stops the check.
