type: fixed
scope: ultracode-goal
summary: |
  `mutate_check.py` no longer reads a mutant as another test's kill when it stops pytest collecting a test module or loading a conftest.py, or stops jest or vitest loading a test file. When a replacement breaks the source such a file imports (a dropped colon, say), no test in that file runs, so the output never names the row's test: the row read `MISATTRIBUTED` with the detail that the test never appears beside a failure token, which the gate reads as a kill by a test of another name, and a gap closed with no test run against the mutant. pytest's errors collecting a module or a directory (its `ERROR collecting <path>` header, a short summary line `ERROR <path>` with no `::` test id, or `Interrupted: N errors during collection`) no longer count as failures, nor does a conftest.py it cannot load before it collects, which it reports as `ImportError while loading conftest` with no summary at all, nor a module the root conftest names in `pytest_plugins`, which stops pytest with a bare traceback. A line inside a multi-line skip reason or failure message that starts with `ERROR` no longer counts as a collection error, and a stats line that counts pytest 9's passed subtests is read. jest's `Test Suites:` line and vitest's `Test Files` line, which count a test file that failed to load as a failed one, are no longer read for a count once their `Tests` line was, one that reads `no tests` included. A red run whose count of failures is 0 now reads `MISATTRIBUTED` with the detail that the output's own count says 0 failed, which the gate reads as a row that cannot run, whether or not the output names the test. A test whose fixture raises still counts as a failure, and under pytest-xdist, where a module that fails to collect sits beside modules that ran, the collection error is no longer counted as a second failure beside a kill. Node's test runner counts a test file it cannot load as a failed test, so there such a mutant still reads as a kill.
