type: fixed
scope: ultracode-goal
summary: |
  Under `--profile production`, `gate_eval.py` now reads a Quality Score, a Recommendation or an NFR Overall Status written behind an icon on its own labelled line, such as `**Overall Status:** ⚠️ CONCERNS`, the form the sample report in TEA 1.27.2's ADR readiness checklist gives each category; the NFR workflow loads that checklist. Before, such a line was not read as a labelled line. A `test-review.md` or `nfr-assessment.md` whose only score or status was written that way returned `reloop` with a "not found" reason, and now reads it. A `FAIL` or `NOT_ASSESSED` status, a `Block` Recommendation or a second, different Quality Score written that way beside the file's other labelled lines was left out and did not fail the signal, and now it fails it, so an `advance` becomes `reloop`, as the same line written without the icon already did. The icon stands right before the value, after the label's colon and emphasis marks: one character from the arrow, technical-symbol, geometric-shape, miscellaneous-symbol, dingbat and emoji blocks (which hold TEA's ✅, ⚠️ and ❌), optionally followed by the variation selector U+FE0F and spaces or tabs. A mathematical sign such as `≤`, an emoji sequence (a flag, a skin tone or a joiner) and emphasis around the value are still not read. A value with its icon after it, as TEA's report template writes it, reads as before, and a file with no labelled line is read as before. `operator_owed.py`, which reads the same signals through `gate_eval.py`, reads them the same way. The threshold of 80, the printed keys and every flag are unchanged.
