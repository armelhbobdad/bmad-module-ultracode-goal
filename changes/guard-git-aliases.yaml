type: fixed
scope: ultracode-goal
summary: |
  The `PreToolUse` guard now treats every git subcommand that git does not run before an alias as both a commit and a push, so `git ci` with `alias.ci = commit` meets the protected-branch, tests-ran, freshness, empty-index and un-skip checks a `git commit` meets. Git runs its own commands first, matched case-sensitively (`git LOG` runs `alias.log`), then an external `git-<name>` command from its exec-path or PATH, such as `git lfs`, and only then an alias, whose definition lives in configuration the command can change before git starts; the guard reads none of it. So a read-only alias such as `git st`, or a typo, now meets those checks too, and the deny names it and says to run the git command it stands for. An external command counts as one only when the command does not move where git finds it (`--exec-path`, a variable set ahead of `git`, or an `env`, `sudo` or `doas` wrapper). The guard now also classifies the commands inside `$(...)`, `<(...)` and backticks, and reads each command once more with quotes respected, so a quoted `;`, `&&` or `|` in an argument no longer hides the subcommand from the checks.
