type: fixed
scope: ultracode-goal
summary: |
  The `PreToolUse` guard now treats a git alias as the command it runs, so `git ci` with `alias.ci = commit` meets the protected-branch, tests-ran, freshness, empty-index and un-skip checks a `git commit` meets, and an alias that runs `git push` meets the protected-branch check. A git subcommand that is not one of git's own commands, spelled as git spells them (`git LOG` runs `alias.log`), is looked up with `git config --get alias.<name>`, with the command's own `-C`, `-c`, `--git-dir`, `--work-tree`, `--bare` and `--config-env` options, through alias chains and `!` shell aliases. A subcommand git finds as an external `git-<name>` command (`git lfs` where `git-lfs` is installed) is that command and no alias, as git runs it first. Where the lookup cannot see what will run, any other such subcommand counts as both a commit and a push: in a command of several segments, since an earlier one can define an alias, include a configuration file or change directory first (`git config alias.ci commit; git ci`, `cd other && git ci`), in a command holding a command substitution, in a command that sets a variable ahead of its `git` (`HOME=`, `XDG_CONFIG_HOME=`, `PATH=`, a `GIT_` one), and when the lookup fails.
