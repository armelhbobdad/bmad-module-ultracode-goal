type: fixed
scope: ultracode-goal
summary: |
  The `PreToolUse` guard now treats a git alias as the command it runs, so `git ci` with `alias.ci = commit` meets the protected-branch, tests-ran, freshness, empty-index and un-skip checks a `git commit` meets, and an alias that runs `git push` meets the protected-branch check. A git subcommand that is not one of git's own commands, spelled as git spells them (`git LOG` runs `alias.log`), is looked up with `git config --get alias.<name>`, with the command's own `-C`, `-c`, `--git-dir`, `--work-tree`, `--bare` and `--config-env` options, through alias chains and `!` shell aliases. Where that lookup cannot see what will run, such a subcommand counts as both a commit and a push: in a command of several segments, since an earlier one can define an alias, include a configuration file or change directory first (`git config alias.ci commit; git ci`, `cd other && git ci`), in a command that sets any variable (`HOME=`, `XDG_CONFIG_HOME=`, a `GIT_` one), and when the lookup fails. So an external git command in a command of several segments, such as `npm test && git lfs pull`, now meets the commit and push checks too.
