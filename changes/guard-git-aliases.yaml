type: fixed
scope: ultracode-goal
summary: |
  The `PreToolUse` guard now treats every git subcommand that is not one of git's built-in commands as both a commit and a push, so `git ci` with `alias.ci = commit` meets the protected-branch, tests-ran, freshness, empty-index and un-skip checks a `git commit` meets. What an alias runs lives in git's configuration, and whether an external `git-<name>` command shadows it depends on PATH, both of which the command can change before git starts, so the guard reads neither. It clears a built-in command, spelled as git spells it (`git LOG` runs `alias.log`), and one of the scripts git ships in its exec-path (`git submodule`, `git mergetool`) while the command does not mention that path. So a read-only alias such as `git st`, an external command such as `git lfs`, and a typo now meet those checks too; the deny names the subcommand and says to run the git command an alias stands for, or an external command by its own name (`git-lfs pull`). The guard now also classifies the commands inside `$(...)`, `<(...)` and backticks outside single quotes, the arguments of `eval` and a command run by `exec`, and reads each command once more with quotes respected, so a quoted `;`, `&&` or `|` in an argument no longer hides the subcommand.
