type: changed
scope: ultracode-goal
summary: |
  In a workspace monorepo the gate no longer measures the main tree's copy of a sibling package. The dependency folders `scripts/link_worktree_deps.py` linked whole into the gate worktree carry the package manager's links to the repo's own packages, which resolved to the main tree, so a cross-package mutation read `GREEN` in the worktree. The script now lists each folder that holds such a link, a peer's link in bun's or pnpm's store included, under a new `workspace` key with its lockfiles, and links nothing at first. The same call with `--install --impl-artifacts <path>` then runs the offline, frozen-lockfile install the lockfile names (`npm ci --offline`, `bun install --frozen-lockfile --offline` or `pnpm install --offline --frozen-lockfile`) in the worktree, prints each install's command, exit code and last error line under `installs`, and links the folders the install did not make. It installs only into the gate's own worktree (one `git worktree list` gives for the project, not the main tree, named `.gate-worktree-<story_id>` inside the implementation artifacts folder) and refuses with exit 3 any other folder, a lockfile or dependency folder that resolves outside that worktree, or any other lockfile shape, so the default `allowlist_commands` is unchanged and no allow rule runs a package manager. When no such install serves (a `yarn.lock`, more than one lockfile, a refusal, or an install that fails), the gate never installs online: it logs the reason in `.decision-log.md`, replaces the worktree, links the folders whole with `--link-workspace`, and reads every mutation row whose command reaches the mutated file's workspace package by its name as one that cannot run.
