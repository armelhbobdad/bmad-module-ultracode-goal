type: changed
scope: ultracode-goal
summary: |
  In a workspace monorepo the gate no longer measures the main tree's copy of a sibling package. The dependency folders `scripts/link_worktree_deps.py` linked whole into the gate worktree carry the package manager's links to the repo's own packages, which resolved to the main tree, so a cross-package mutation read `GREEN` in the worktree. The script now lists each folder that holds such a link, a peer's link in bun's or pnpm's store included, under a new `workspace` key with its lockfiles, and links nothing until the worktree has had an offline install from the lockfile's package manager (`npm ci --offline`, `bun install --frozen-lockfile --offline` or `pnpm install --offline --frozen-lockfile`, now on the default `allowlist_commands`); the same call with `--installed` then links the folders the install did not make. When no such install serves (a `yarn.lock`, more than one lockfile, or an install that fails or is refused), the gate never installs online: it logs the failure in `.decision-log.md`, replaces the worktree, links the folders whole with `--link-workspace`, and reads every mutation row whose command reaches the mutated file's workspace package by its name as one that cannot run.
