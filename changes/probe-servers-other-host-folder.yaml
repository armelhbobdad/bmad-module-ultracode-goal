type: fixed
scope: ultracode-goal
summary: |
  `scripts/probe_servers.py` no longer names a folder on this machine for a URL whose connection reached another machine's address, a container's say. A server here that listens on every address at that port never took that connection, yet the probe gave its folder as the one the server that answered runs from, so the gate could tell its assessors that a server from that folder answered. The probe now gives such a URL a `cwd` of `null`. To tell this machine's addresses from another's, it listens briefly on the address the connection reached, at a port the system picks, and connects to itself there; it does so only on Linux, and only when `/proc` lists a socket on this machine that could have taken the connection and the answer counts, so on macOS and Windows it opens no listening socket.
