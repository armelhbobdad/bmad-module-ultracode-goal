type: changed
scope: ultracode-goal
summary: |
  `health_check_autosubmit = true` posts unattended only when the `gh` calls a submission makes are allowed, and the `customize.toml` comment and the Health Check page now say so, with the override to add under `[workflow]`: `allowlist_commands = ["gh auth status", "gh search issues", "gh label create", "gh issue create"]`, which appends to the shipped list. They also say that these rules stay in `.claude/settings.local.json` for every later session in the project, how to scope the last three to `health_check_repo` (`"gh issue create --repo <health_check_repo>"` and the like), and how to remove them when autosubmit is turned off. None is allowed by default. When the session refuses a `gh` call, the health check now makes no further `gh` call and queues that finding and every bug finding not yet submitted, with the reason "A gh call was refused in this session; allow the health check's gh commands (see health_check_autosubmit) to submit unattended." in an unattended run and "You declined a gh call; nothing was posted." in an attended one, where a refused `gh auth status` used to report "GitHub CLI is not available." In an unattended run, the lines that list the issues it created now go to the decision log instead of the screen, as a queued finding's lines do.
