type: fixed
scope: ultracode-goal
summary: |
  In production, the run now bounds what it hands TEA's test review, whose Quality Score `gate_eval.py` reads as written. The stage text said when `bmad-testarch-test-review` runs and which tree it reviews, but not what the reviewer may read, so a delegation could pass it the run's rulings, `.decision-log.md` or an earlier review of the same story, and a reviewer told that a pattern was already accepted could score the tests at 80 or above where a review of the tests alone scored them lower, turning a `reloop` into an `advance`. The reviewer is now handed the tree it reviews, the story's acceptance criteria and their priorities, copied out of the story file rather than the file itself, the story's diff from its baseline, and the records Execute already gives a review (the story's mutation ledger, the Epic's class ledger and each Operator notes entry given before launch that names the story), and nothing else the run wrote, a ruling made during the run included. It is also told that nothing it was handed waives a finding, lowers a severity or raises a score. TEA's test review adds to a report already at the path it writes, so before each test review but a delta gate's re-check, the run now moves the story's earlier `test-review-<story_id>.md` into the story's `evidence-<story_id>/` folder under a `-cycle-<n>` name, and a re-loop's review no longer starts from the earlier one. The bound covers the review Execute runs for each story, on a re-loop too, and any test review the gate runs. A delta gate's re-check still reads its own earlier review, and that gate still cannot advance. `gate_eval.py` and its threshold of 80 are unchanged, so a given `test-review.md` returns the verdict it returned before.
