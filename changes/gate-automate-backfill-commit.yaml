type: changed
scope: ultracode-goal
summary: |
  When `bmad-testarch-automate` backfills a test at the gate, the run now commits it before trace runs. It logs a `gate-backfill-base:` line naming the commit automate measured, stages the test files that pass's summary names by explicit path (listed with `git status --porcelain --untracked-files=all`, so a test in a new folder is not missed, and copied into the main tree first when automate wrote it into the worktree), runs the full sweep with them staged, writes a fresh `.tests-ran-<story_id>` marker, commits, refreshes `.commit-<story_id>`, logs a `gate-backfill:` line and rebuilds the gate worktree at the new commit, which trace, NFR and test review then measure and the verdict's `assessed-commit` line names. Before, the backfill waited for the evidence commit after the verdict, so trace counted a test the assessed commit did not hold. A test the summary names that neither tree holds as a change is left out and logged as a gap. The gate fixes a red in that sweep only in the backfilled test files, at most twice, and reads a repo commit hook's rejection of the backfill commit as such a red, within the same two fixes. A repo commit hook that rejects the advance route's evidence commit is answered only in what the gate writes for that commit (the `done` sync in `sprint-status.yaml` and `.decision-log.md`), at most twice; when it asks for a change to any other path, such as a file TEA wrote or a ledger row, or rejects the commit a third time, the gate commits nothing and escalates the story with `kind` `evidence-commit-rejected`, and a resume makes that commit only once `/ucg-resolve` has closed the escalation. The gate leaves a `.evidence-owed-<story_id>` marker until that commit is made, since `/ucg-resolve` deletes the sidecar when it closes it. On the Epic's last story the rejection comes after the Epic-level gate advanced, so the run ends `blocked`, its resume makes the commit and goes to Finalize instead of stopping at "epic already complete", and `drive_epic.py` stops with `evidence-owed` instead of `all-done`. A red that needs any other change ends the cycle before trace, and of what automate's pass and its backfill produce it is the only thing that does (a sub-skill that blocks on input or is not installed still escalates the story): nothing is committed, the backfilled tests stay staged for the re-loop's commit, a `reloop` verdict is logged as a JSON object with its `reasons` and an `assessed-commit` line naming the commit automate measured (the heartbeat's `last_reasons` copies those reasons, and an attended run prints the verdict with `gate_status` `n/a`), the re-loop takes the red and every open gap that is neither `unmeasured` nor `unkilled` as its findings, and the gate after it is a full one. At most one automate pass now finishes per gate cycle, and a backfill never restarts the cycle. Its summary is named for the story and the commit it measured, `automation-summary-<story_id>-<sha>.md` in the run folder, and holds, verbatim, the `mutate_check.py` table rows behind each gap it backfilled or reported and behind each open gap it re-ran and leaves open. A resume that finds that summary complete reuses it instead of running automate again, and one that finds it incomplete moves it aside with a `-stale-<n>` suffix, logged, before automate runs. The gate logs a `gate-automate:` line naming the commit automate measures right before it delegates automate, so a resume that finds that line for `HEAD` with no verdict and no backfill line after it goes on with that gate cycle, through that summary check, instead of re-driving the story. Automate backfills every gap it finds on a P0 criterion, in any cycle and whatever its scope, even while operator live results sit at the commit under assessment (the backfill commit moves the commit past them, and the gate's existing operator-evidence routes owe them again at the new commit), so TEA's trace counts the new test and `gate_eval.py` decides. Automate measures each risk it names on a P0 criterion in the same pass, and backfills each gap that measuring confirms. It also confirms each test it backfills in the same pass: it writes the test to the main tree, copies it into the gate worktree and re-runs the gap's rows there with it in place, each with a command that runs the test's file. A test that runs and leaves a row `GREEN` (its mutant may be an equivalent one, which no test can kill) is still committed and is logged as an `unkilled` gap, which no later pass writes another test for while its rows still run. A later cycle of the same story, full or delta, scopes automate's search to the diff since the previous gate's `assessed-commit` plus a re-run of the rows behind the previous cycle's backfilled gaps and every open gap, and when that diff is empty runs automate only when an open gap's line names a commit other than the commit under assessment. Only a gap on another criterion is reported rather than backfilled: one outside a later cycle's scope, or any while live results sit at the commit. A reported gap, a P0 risk left unmeasured (logged `unmeasured`), a backfilled test that was never written and an `unkilled` backfill are logged as `gate-gap:` lines, which every later cycle carries until a pass at a later commit finds the gap's mutants killed (`KILLED`, `KILLED+others`, or `MISATTRIBUTED` because a test of another name went red). A row that reads `GREEN`, in any pass and whether it searches, re-runs or confirms, counts as a gap unless it reads killed when run again with its command replaced by the test command of the story's full sweep that covers its file, so a closing test in a file the row's own command does not run still closes the gap; automate records both results beside the row in its summary, and a second run that cannot run leaves the row a gap. A gap whose rows cannot run (a stale anchor, a mutant that breaks a module so no test runs, or a table `mutate_check.py` refuses) is measured afresh once in the pass, and when the fresh rows cannot run either it is logged `unmeasured` for the next pass, so a pass always finishes. A `gate-gap:` line never changes the route a verdict takes: on a `reloop` that is not cap-only it is one of the findings unless it is `unmeasured` or `unkilled`, and on `advance` or `defer` it becomes a ledger row with `source` `gate` and `severity` `med`, which is neither a gate FAIL nor a critical finding whatever its criterion's priority, so it never re-loops or escalates the story. A resume that finds `gate-backfill-base:` or `gate-backfill:` with no verdict logged after it, while `HEAD` is still that backfill's base or its commit, goes on with that gate cycle instead of re-driving the story or running automate again; a resume after a re-loop that ended its cycle before trace, with `HEAD` still at its assessed commit, resumes that re-loop instead of gating the story. The docs and `ucg-status` now name the backfill commit among a story's commits.
