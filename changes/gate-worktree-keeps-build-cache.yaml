type: changed
scope: ultracode-goal
summary: |
  The production gate's worktree rebuild no longer throws away a Cargo build. A new script, `carry_build_cache.py`, moves each build folder of the gate worktree (every folder holding Cargo's `CACHEDIR.TAG` and `.rustc_info.json`, or a folder of another toolchain named with `--dir`) into the story's `.scratch-<story_id>/gate-build/` stash right before a `git worktree remove --force` after which the story is gated again (the rebuild once automate has finished, the removal once a `reloop` verdict is recorded, and a resume's removal of a dead session's worktree), and back to the same path right after every `git worktree add`, so each story pays one cold build instead of two. After an `escalate`, `advance` or `defer` verdict nothing is carried, and the build folder is deleted with the worktree as before. The script moves folders with a rename only, never carries a test-result cache (`.pytest_cache`, a turbo or nx cache) or a folder reached through a link, deletes the run results Cargo's tools keep in a build folder (`criterion/`, `nextest/`, `tarpaulin/`, `*.profraw`) before carrying it, and leaves a folder it cannot move to be deleted with the worktree, so a build is cold but never wrong. The decision log's honesty line names each folder carried, skipped or failed. Mutated sources and copied tests are still discarded, and the cache never passes from one story to the next. The readiness check's scans of the implementation artifacts folder now skip a story's scratch and evidence folders as they walk, with the same result.
