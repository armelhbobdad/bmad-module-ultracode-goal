type: changed
scope: ultracode-goal
summary: |
  A story's evidence now has a folder no step removes, `{workflow.implementation_artifacts}/evidence-<story_id>/`. The red-phase capture of a stack where ATDD cannot generate the scaffold, a sweep log the story record or the gate cites, a coupled-stories measurement and a planted-defect run go there, while a throwaway runner or harness stays in `.scratch-<story_id>/`, whose lifetime is unchanged. Before, no rule named a home for those files, so they went into the scratch directory, which Execute removes once step 5's re-verify goes green and the gate's backfill removes again, so following the rule deleted what trace and the story record cite, and keeping it was logged as a deviation on every story. The mutation ledger keeps its own `mutation-ledger-<story_id>.md`. The folder holds captured output and the notes recorded on it, nothing runnable. Each capture is named by the step that wrote it and the commit `HEAD` named when it ran (`sweep-step2-<short sha>.log`, `sweep-step5-<short sha>.log`, `sweep-backfill-<short sha>.log`), with the next free number (`-2`) when the name is taken, so no capture overwrites another, and a file already there when step 0 writes a fresh baseline belongs to an earlier run and is never cited as this run's. On a tracked artifact tree the folder stays untracked, so the gate's evidence commit carries the same paths as before.
