type: fixed
scope: installer
summary: |
  With UCG awareness enabled, the installer now writes the planning shaping overlays (`_bmad/custom/bmad-prd.toml`, `bmad-architecture.toml`, `bmad-create-epics-and-stories.toml` and `ucg-create-story.toml`) on a project that runs BMAD Method 6.11 or later. BMAD 6.11 moved the customization merge out of `_bmad/scripts/resolve_customization.py` into `_bmad/scripts/config_utils.py`, and UCG's merge looked for it only in the first file, so each fragment failed with "merge engine (resolve_customization.py) missing" and no overlay was written. Projects on BMAD 6.10.0 and earlier are unaffected. `update` does not re-run the awareness merge, so a project on 6.11 or later that was installed without the overlays gets them from a fresh install: run `npx bmad-module-ultracode-goal install`, choose Fresh install, and answer Yes at the awareness prompt. A fresh install rewrites `_bmad/ucg/config.yaml` from defaults, so note any value you changed there first.
