type: added
scope: ultracode-goal
summary: |
  `health_check_fp.py fingerprint --stdin` now also reads a `short_description` and, given one, prints the issue `title` (`[health-check][<severity>][<fp>] ultracode-goal/<stage>: <description>`), its `regression_title` (with `REGRESSION: ` before the description) and the `body_header`: the Workflow, Step File, Section, Severity, Fingerprint (with its `Section fingerprint:` line) and Defect Key sections the dedup Action reads. Without a description the three are `null`. It refuses, with exit `1`, a description that is empty or holds a backtick, `$`, a double quote, a backslash, `!` or a character that is not printable (a tab or a line break included), each of which the shell acts on inside the title's quotes or a pasted command breaks on, and one that makes `regression_title` longer than the 256 characters GitHub takes: a backtick used to run the name it held as a command and drop it from the filed title. The JSON is printed in UTF-8, a non-ASCII character as itself. `health_check_fp.py seen` now also prints the `opening_line` a regression's or a possible regression's issue body opens with, or `null` for any other verdict: a fix recorded as `resolved` gives its date, and an issue found closed as completed, or merged, gives the date of its report instead. The health check uses all four exactly as printed, so it no longer builds a title, a machine-read body line or a regression line by hand, and the issue template's command takes the description too.
