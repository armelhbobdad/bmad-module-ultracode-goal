type: breaking
scope: ultracode-goal
summary: |
  Preflight now writes each hook command with every injected value and the script path in single quotes (`KEY='value' uv run '<path>'`), so a project or skill folder whose path holds a space (`~/My Projects`, say) arms hooks that start. Before, the shell split such a path, so the `PreToolUse` guard and the `Stop` budget hook never started and every tool call ran unchecked; with the guard now armed with `"onFailure": "block"`, an unquoted command like that would refuse every tool call instead. `preflight_check.py --assert-armed` now reads each UCG hook command the way the shell splits it and fails one that would not start its script as `<env> uv run <script>`, reporting `checks.hooks.commands_start_scripts` and `checks.hooks.command_problems`, and a resume answers that reason by re-merging the hooks in place. Troubleshooting's "Every tool call is refused" entry names this cause and the message it gives.
migration: |
  Nothing to do for a run preflight arms from now on. A run already in flight under a path with a space re-arms on its next resume, which finds the unquoted commands, re-merges the hooks with the quotes and asserts again; make that resume attended (not `-H` or `drive_epic.py`), since a headless one stops at the settings write. A UCG hook command written by hand in another shape than `<env> uv run '<script>'`, such as `python3 <script>`, now fails `--assert-armed` the same way, and that resume rewrites it.
