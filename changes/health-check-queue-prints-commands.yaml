type: changed
scope: ultracode-goal
summary: |
  `health_check_fp.py queue` now also takes `--title` and `--repo` and prints `{"path", "commands"}`: the `gh label create` and the `gh issue create` that submit the queued finding, and the `gh issue create` without labels for a reporter without push access, each on one line with every argument quoted for a POSIX shell and `--repo` right after the subcommand. It reads the stage, the severity and the fingerprint from the body header the draft opens with. The health check shows or logs those commands exactly as printed, where it used to fill them in itself and left the body path unquoted, so a project path holding a space gave a command `gh` rejected when pasted. `queue` refuses, with exit `1` and no file written, a draft that does not open with a body header, a `--stage` or a `--title` that is not that draft's, a title longer than 256 characters or holding a character the title rule refuses, and a `--repo` that is not `[HOST/]OWNER/REPO`. The label create no longer ends in `2>/dev/null || true`, in the printed commands, in the health check's own call or on the Health Check page: a failed label create, the label there already or no push access, is no error, and the create follows.
