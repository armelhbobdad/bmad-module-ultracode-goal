summary: |
  `mutate_check.py` now accepts a row whose `replacement` is the empty string, a deletion mutation that removes the anchor. It used to refuse the whole table with exit 2 before any row ran, saying the key was missing. A row whose `file`, `anchor`, `command` or `expect_red` is empty is still refused, now with a message that names the empty key instead of calling it missing, and a `replacement` that is not a string still reads as missing.
