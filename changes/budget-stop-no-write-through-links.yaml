type: fixed
scope: ultracode-goal
summary: |
  The turn-budget `Stop` hook no longer reads or writes through a symlink at the name of its turn counter (`.budget-<story>.json`) or its turn-ceiling marker (`.escalation-<story>.md`), and no longer waits on a FIFO there. It followed a link at either name, so a link to a file outside the implementation artifacts folder had that file's contents replaced by the count, or by the marker text at the ceiling, and a FIFO at the counter's name kept the hook waiting until Claude Code's hook timeout, with the turn uncounted. It now opens the counter without following a link or waiting, writes each file through a new one renamed onto the name, and leaves a name that holds a link, a FIFO, a folder or any other file that is not a regular one as it is, saying so on stderr. At the counter's name the turn then counts against `unknown`; at the marker's no marker is written, and the overrun message says so.
