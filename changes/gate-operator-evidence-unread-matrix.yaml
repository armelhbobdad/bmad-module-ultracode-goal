type: changed
scope: ultracode-goal, ucg-resolve
summary: |
  A gate `FAIL` whose operator-evidence check could not read TEA's coverage matrix now escalates instead of re-looping. `operator_owed.py` prints a new key, `evaluated`, which is `false` when the gate is a full-instrument `FAIL`, the story file tags a criterion `**Gate-ability:** operator-evidence`, and the matrix cannot be read (there is no trace report, or it names no absolute `tempCoverageMatrixPath`, the file it names is gone, or the matrix or the summary is not this gate's or measured another commit). Before, the script printed `owed: false` in that case, the same answer as work a re-loop can build, and the story re-looped over evidence only a person can record. Such a story now escalates `operator-evidence-owed` with a decision that opens `The operator-evidence check could not read trace's coverage matrix`, spending no re-loop and naming why the matrix could not be read and what the close waits on. The gate moves that cycle's trace files aside first, so `/ucg-resolve` closes that escalation at once the first time at that commit and the re-gate runs trace again, and after that only on the operator's written confirmation that trace can leave a readable matrix there. A hand-authored trace, which holds no matrix by design, keeps the re-loop, and so does a decomposed child none of whose claimed criteria carries the tag. A story that tags no such criterion is answered without reading the matrix (its `open` list is then empty) and keeps the re-loop, and `owed` is still `true` only on a matrix the script read. The trace delegation now asks that `trace-<story_id>.md` keep `tempCoverageMatrixPath` in its frontmatter after TEA's step 5.
