type: breaking
scope: ultracode-goal
summary: |
  Cross-Session Recall no longer uses claude-mem, so recall through claude-mem stops working. While a run latch (`.mem-state.json` in the implementation artifacts folder) is present, the `PreToolUse` guard now denies every claude-mem MCP call, in the plugin form and both bare-server forms, every MCP resource read or listing on a claude-mem server, and every Read, Grep, Glob, Write, Edit, MultiEdit, NotebookEdit or Bash call that reaches into `.claude-mem`, whatever the latch records: there is no green path any more, where a green latch used to let them through. Recall keeps one record per run in a local store UCG owns instead, under the folder `cross_session_recall_store` names, and with `cross_session_recall = "on"` the run's latch now checks that this store can be written, with no MCP call; with the store key unset, the latch is red and the run report carries `NOTE recall-store-unset`. While a latch names the store, the guard also denies a Read, Grep, Glob, Write, Edit, MultiEdit, NotebookEdit or Bash call that names it, except a Bash call that runs the skill's own `mem_recall.py` or `mem_observation.py` by its installed path, directly after `uv run` or `python`, as a shell segment of its own, with no redirection, command substitution or wrapper, no leading assignment such as `PATH=`, `PYTHONPATH=` or `HOME=`, and nothing else in the command that changes the environment or what `uv` and `python` resolve to. A present latch counts as a live run: a latch left behind by a run that died keeps denying until the next run's Stage 1 replaces it or you delete it, and every deny it causes names the latch file.
migration: |
  If you ran with `cross_session_recall = "on"`, recall stays off until you opt in again by setting `cross_session_recall_store` in `[workflow]` of `customize.toml`, for example to `~/.ultracode-goal/recall`, so no run summary moves to a new place without your choice. Your claude-mem history is not imported: recall starts empty, and a root cause counts as recurring once two runs record it. UCG does not stop claude-mem's own capture where claude-mem is installed. No latch lets a claude-mem call through any more, so a latch you write yourself between `drive_epic` drives can no longer turn claude-mem recall on. If a claude-mem call, or a call that names the store, is denied while no run is active, delete the latch file the deny names.
