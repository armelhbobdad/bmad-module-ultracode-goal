type: breaking
scope: ultracode-goal
summary: |
  Cross-Session Recall no longer uses claude-mem, so recall through claude-mem stops working, and nothing in the skill calls claude-mem any more. Recall now keeps one record per run in a local store UCG owns, in the folder `cross_session_recall_store` names. Two scripts drive it. Stage 1 runs `mem_recall.py latch` and, on a green latch, one `mem_recall.py filter`. Finalize runs `mem_observation.py drain` and then `mem_observation.py write`, only under this run's green latch. With `cross_session_recall = "on"`, the latch checks that the store can be written, with no MCP call. With the store key unset, the latch is red and the run report carries `NOTE recall-store-unset`. A run that reaches Finalize with no latch, or with another run's, logs `NOTE recall-latch-missing` and writes no record. A recall call the permission layer refuses logs `NOTE recall-read-refused` or `NOTE recall-write-refused` and is not retried. Each invocation, a resume or a `drive_epic` spawn included, mints its own run id, so each writes its own record. While a run latch (`.mem-state.json` in the implementation artifacts folder) is present, whatever it records, the `PreToolUse` guard now does three things. It denies every claude-mem MCP call, in the plugin form and both bare-server forms, every MCP resource read or listing on a claude-mem server, and every Read, Grep, Glob, Write, Edit, MultiEdit, NotebookEdit or Bash call that reaches into `.claude-mem`; a green latch no longer lets them through. When the latch names the store, it denies a Read, Grep, Glob, Write, Edit, MultiEdit, NotebookEdit or Bash call that names the store. It also denies a Write, Edit, MultiEdit or NotebookEdit call that names the latch file, and a Bash segment that names it, by its path or by its file name alone, and would change it (`rm`, `mv`, `cp`, `tee`, a redirection, `sed -i`, `truncate`, `python -c`, or anything else it cannot tell only reads it). Read, Grep, Glob and a plain `cat` of the latch stay allowed. The only Bash calls let through to the store or the latch run the skill's own `mem_recall.py` or `mem_observation.py` by its installed path, directly after `uv run` or `python`, as a shell segment of its own, with no redirection, command substitution or wrapper, no leading assignment such as `PATH=`, `PYTHONPATH=` or `HOME=`, and nothing else in the command that changes the environment or what `uv` and `python` resolve to. Only `mem_recall.py` changes the latch: `latch` writes or replaces it, and the new `mem_recall.py unlatch --impl-artifacts DIR --run-id RUN_ID` removes it at each exit (Finalize, a preflight stop, the headless exit path, or any other stop before Finalize), only when it carries that run's id, and prints `{"removed": ..., "reason": ...}`. A present latch counts as a live run. A latch left behind by a run that ended without removing it keeps denying until the next run's Stage 1 replaces it or you delete it by hand. Every deny it causes names the latch file and ends with a note: you delete it by hand, and the model must not remove it itself.
migration: |
  If you ran with `cross_session_recall = "on"`, recall stays off until you opt in again. Set `cross_session_recall_store` in the `[workflow]` table of your `_bmad/custom/ultracode-goal.toml`, for example to `~/.ultracode-goal/recall`. No run summary moves to a new place without your choice. Your claude-mem history is not imported: recall starts empty, and a root cause counts as recurring once two runs record it. A summary an earlier version parked in `mem-outbox.<run_id>.jsonl` is converted into a store record by the next green Finalize's drain, and `mem-outbox.dead.jsonl` is kept as it is. UCG does not stop claude-mem's own capture where claude-mem is installed. The claude-mem script forms are removed, and each now exits 2 with one line naming its replacement: `mem_recall.py selftest` (use `mem_recall.py latch --store VALUE`, which checks the store), the `latch` flags `--probe` and `--claude-mem-absent` (use `latch --store VALUE`) and `--tool-form` (drop it), a `latch` or `filter` call without `--store` (pass `--store VALUE`), `filter --probe` (use `filter --store VALUE`), `filter --project` (drop it: the store tells repos apart by fingerprint), `mem_observation.py build` with all its flags and `mem_observation.py spill` (use `mem_observation.py write --store VALUE`, which parks the record in the outbox itself), and `mem_observation.py drain` without `--store` (use `drain --store VALUE`). Do not write a latch yourself between `drive_epic` drives: no latch lets a claude-mem call through any more, and one the next spawn does not replace keeps denying. If a claude-mem call, or a call that names the store or changes the latch, is denied while no run is active, delete the latch file the deny names by hand. The guard denies the model's own ways to remove it, such as `rm` or a file tool, and the deny note tells the model not to try.
