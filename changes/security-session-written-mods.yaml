type: docs
summary: |
  The security policy's limit on Claude Code mods now covers a mod the session writes itself, not only one you install. A session can write a mod into its own mods folder, `~/.claude/dev-mods/` followed by the session's ID: Claude Code asks first in `default` and `acceptEdits` mode, refuses the write in `dontAsk` mode, leaves it to its classifier in `auto` mode and lets it through in `bypassPermissions` mode. Such a mod can load without asking when the turn that wrote it ends, in `auto` and `bypassPermissions` mode, and when the session is resumed. Once loaded, it acts as a mod you install, so it can approve a call the `PreToolUse` guard denied unless the machine has managed settings or a `managed-mcp.json` file or the session's credential is a Team or Enterprise `/login`, and the guard does not refuse writes to that folder. The policy now names the `managed-mcp.json` file among those conditions, and says that even under them a mod can answer a tool call itself, which keeps the guard from running for that call, and that a mod's own file and process calls can skip the guard. It also gives what a test on Claude Code 2.1.330 under `claude -p` saw in each permission mode, and says to delete any mod you did not ask for from a session's mods folder before you resume it.
