type: docs
summary: |
  The security policy's limit on Claude Code mods now covers a mod the session writes itself, not only one you install. A session can write a mod into its own mods folder, `~/.claude/dev-mods/` followed by the session's ID: in `auto` mode the classifier decides and in `bypassPermissions` mode the write goes through, while `default` and `acceptEdits` ask first and `dontAsk` refuses it. Claude Code can load such a mod when the turn that wrote it ends, in `auto` and `bypassPermissions`, and when the session is resumed. Once loaded, it can approve a call the `PreToolUse` guard denied, in a session with neither managed settings nor a Team or Enterprise `/login`, and the guard does not refuse writes to that folder. The policy says which permission modes saw no such write or load in a test on Claude Code 2.1.330 under `claude -p`, where a `stream-json` run lists the mods it loaded, and to delete a mod you did not ask for from the session's mods folder before you resume it.
