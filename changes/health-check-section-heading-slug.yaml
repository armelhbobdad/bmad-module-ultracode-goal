type: changed
scope: ultracode-goal
summary: |
  The health check no longer makes up the section slug and the defect key it fingerprints. `health_check_fp.py fingerprint --stdin` reads a JSON object holding the `section_heading` and the `defect_name`: it refuses a heading that is not one of the stage file's own, turns it into the slug (no leading `#`s or numbering, lower-cased, each run of other characters a hyphen), turns the name into the defect key (`gate_eval.py` gives `gate-eval`, `composeStories` gives `compose-stories`, a longer name keeps its last four words), and prints both as `section_slug` and `defect_key` beside the fingerprints. `--section-slug` and `--defect-key` still work, and the issue template now gives the command to a manual filer instead of asking for two hand-computed sha1 hashes. Issues and seen-cache records made by version 7.1.0 and earlier hash a slug the model chose, so wherever that slug differed from the real heading's, as it mostly did, their fingerprint no longer equals the new section fingerprint (`legacy_fp`): the section-fingerprint search and the dedup Action's possible-duplicate flag no longer find such an issue, and a recurrence of one of those defects is filed without its "Possibly a regression of #N" line. Nothing is silenced, since a record under a section fingerprint never suppresses a finding.
