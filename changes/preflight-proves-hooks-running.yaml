type: breaking
scope: ultracode-goal
summary: |
  Preflight now proves that the running Claude Code session loaded the hooks it arms, and stops when it did not. It writes the PreToolUse guard and the Stop budget hook into `.claude/settings.local.json` while the session runs, and `preflight_check.py --assert-armed` reads only that file, so when Claude Code's file watcher missed the write, the whole story loop ran with no guard and no turn count while the decision log said the hooks were armed. The last step of arming now makes one `git commit --dry-run`, which creates no commit and runs no commit hook, and a guard the session runs must refuse it with `Tests-ran guard: refusing` and `current story (unknown)`. When neither that call nor a second one, made after `--assert-armed` runs again, is refused, an attended run asks the operator to quit and resume the conversation, then probes once more and stops if the guard still does not refuse it, and a headless run stops on a RED blocker. Another reason from the guard, or a guard that cannot start, stops the run too. `--assert-armed` and its output are unchanged: its `armed` certifies the file, not the session. The troubleshooting guide's "Hooks not firing" now says what keeps a session from running the file's hooks.
migration: |
  If preflight stops saying this session does not run the hooks, quit Claude Code and resume the conversation (`claude --continue` in the project, or reopen it in the desktop app) and say continue, or start a new session and invoke the run again; a headless run takes a new invocation. If `/hooks` there does not list the guard, see "Hooks not firing" in the troubleshooting guide.
