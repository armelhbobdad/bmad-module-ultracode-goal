type: changed
scope: ultracode-goal
summary: |
  Execute now says how to wait on background work so that waiting uses as little of a story's turn ceiling as it can. The Stop hook counts one turn per response, and a background task's notification that lands while the session is idle starts a response of its own, so a response that only acknowledged a finished sweep or review counted the same as one that edits code, and a story whose sweeps, reviews and gate assessors ran in the background could reach `max_turns_per_story` on waiting and escalate as `budget-overrun`. The run now has each wait report once (concurrent commands as one background command that prints each one's exit status, concurrent subagents as one workflow or as calls the session waits for), watches for completion rather than progress, and starts no other story's work while a story is current, since the hook books those turns to the current story. The count itself is unchanged, and the troubleshooting guide now says what it includes.
