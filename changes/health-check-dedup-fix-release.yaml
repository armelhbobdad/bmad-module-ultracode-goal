type: docs
summary: |
  The Health Check page now says that the repository's dedup Action measures a report from an outdated copy against the release that carried the fix, not against the latest release. When no earlier open issue shares the report's fingerprint but an earlier issue with it was closed as completed, the release that carried the fix is the earliest stable release, neither a draft nor a prerelease, published after the most recent such close. The Action closes the report as not planned, with the `duplicate` label and a comment that names that release and asks the reporter to update to the latest release, only when the report's Module Version is older than the release that carried the fix. A report from that release or a newer one may show a regression of the fix, so it stays open for a maintainer, as it does on any doubt (no stable release published after the close, a release tag that is not a plain `X.Y.Z`, a release list that cannot be read). Before, a report older than the latest release was closed even when it came from the release that carried the fix, so a regression seen on that release was closed too, and the health check that filed it read the issue as handled and did not report it again.
