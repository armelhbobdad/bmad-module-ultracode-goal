type: changed
scope: ultracode-goal
summary: |
  A `commit-msg` hook (commitlint, say) that rejects only a commit's message no longer costs a full re-sweep. Git runs that hook only once every `pre-commit` job has passed, so such a rejection asks for no file change: on the story's own commits, Execute now rewords `message.txt`, runs the claim check again and retries the commit with the marker as it stands, writing no fresh marker, and step 5's re-verify measures the committed tree as before, a change a `pre-commit` job staged on the way included. It rewords at most twice for one commit, and when the hook rejects the second rewording too, it commits nothing and escalates the story, naming the hook and the rule it applies. A path the re-run claim check has the run stage or edit is a file change, which takes the full rule. The gate answers that rejection in the message too, on its commit of an automate backfill (with no sweep re-run) and on its evidence commit, and each such retry counts as one of that commit's two fixes, after which the backfill still ends the cycle at a re-loop and the evidence commit still escalates as `evidence-commit-rejected`. A rejection that needs a file changed, or whose output does not show a `commit-msg` hook, keeps the rule it had.
