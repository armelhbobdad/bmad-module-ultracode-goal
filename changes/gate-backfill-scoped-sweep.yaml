type: added
scope: ultracode-goal
summary: |
  New `customize.toml` key `backfill_sweep` in `[workflow]`, `full` by default. Set to `scoped`, the sweep the gate runs before it commits a test `bmad-testarch-automate` backfilled re-runs only the checks of the packages that hold those files and every check that reads files across packages or git's file list (format, lint and type checks, scanners, tracked-files gates, line caps, build-input manifests), cache-defeated, and prints each check it leaves out. It does so only when every staged path is a test file (named as its toolchain names one: `*.test.*`, `*.spec.*`, `test_*.py`, `*_test.py`, `*_test.go` or a file in a Rust crate's top-level `tests/` folder, and mentioned by no other tracked file), Execute's full step-5 sweep went green at the commit the backfill builds on and its capture is in `evidence-<story_id>/` as `sweep-step5-<short sha>.log`, the story's marker holds no earlier `sweep=` line, and every fix stays inside those files. The `.tests-ran-<story_id>` marker keeps `scope=full` and gains a `sweep=` line naming both captures, so `gate_eval.py --tests-ran` reads it as before. Any other backfill, or any other value of the key, runs the full sweep.
