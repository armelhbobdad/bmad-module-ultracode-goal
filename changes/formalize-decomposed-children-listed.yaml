type: added
scope: ultracode-goal, ucg-formalize
summary: |
  The readiness check (`formalize_check.py`) lists in `checks.decomposed_children` each story key it reads as a decomposed child, with the parent story file its criteria come from and the parent's row. The list gates nothing. Preflight and `/ucg-formalize` log it with the verdict, and an interactive run shows it (in the launch briefing, or with the readiness verdict), because a story inserted above a `done` parent's row reads the same way as a child, and this is where the operator can catch one. So does a story whose title starts with a single letter or a roman numeral (`2-4-a-new-login-page`) when its file is named by its story number alone (`2-4.md`) or by another title: Define-Done renames that file after the key with `mv` rather than creating a second story file, unless another listed key names the same file, which makes it a parent's.
