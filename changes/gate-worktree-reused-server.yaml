type: fixed
scope: ultracode-goal
summary: |
  The gate now checks, before its first run in the measurement worktree and again after the rebuild, whether a test runner would attach to a server that is already running instead of starting its own from the worktree (Playwright's `reuseExistingServer`, which TEA's framework scaffold sets outside CI). Such a server, often a dev server started from the main tree, serves the tree it was started from, so a browser run from the worktree measured that tree's source and a mutation written into the worktree never reached it. The new `scripts/probe_servers.py`, run with `uv run`, reports which of the URLs a runner config may reuse already answer and, on Linux, the folder the server that answered runs from. The gate never stops such a server. When the runner config allows it without editing a tracked file, it gives the worktree's runs their own server on a free port through a scratch runner config passed with the runner's config flag, checks that the port is still free before each assessor runs under it, and automate before each mutation table, since a server an earlier run left up can hold it, and runs no two assessors under it at once; otherwise it tells every assessor, automate included, what the server limits. Automate then writes no mutation row whose command runs through that server and whose mutated file that server would load, even when the worktree's own spec loads that file too, and such a row it runs reads as one that cannot run, whatever `mutate_check.py` prints, rather than as a `GREEN` gap or a kill: no test is backfilled for it, no `unkilled` line is logged from it and no line closes on it, and the gap is measured another way or logged `unmeasured`. `mutate_check.py` now reads a Playwright run that could not start its web server (its port already used, or its start command failing or timing out) as one in which no test ran, a row that cannot run, rather than as a kill. The decision log's worktree line names the server and what it left unmeasured, and the operating tips now advise stopping a dev server before an unattended drive.
