type: fixed
scope: ultracode-goal
summary: |
  The gate now checks, before its first run in the measurement worktree and again after the rebuild, whether a test runner would attach to a server that is already running instead of starting its own from the worktree (Playwright's `reuseExistingServer`, which TEA's framework scaffold sets outside CI). Such a server, often a dev server started from the main tree, serves the tree it was started from, so a browser run from the worktree measured that tree's source and a mutation written into the worktree never reached it. The new `scripts/probe_servers.py`, run with `uv run`, reports which of the URLs a runner config may reuse already answer and, on Linux, the folder each answering server runs from. The gate never stops such a server. When the runner config allows it without editing a tracked file, it gives the worktree's runs their own server on a free port through a scratch runner config passed with the runner's config flag; otherwise it tells every assessor, automate included, what the server limits. Automate then writes no mutation row whose mutant only that server would load, and a row it runs through that server reads as one that cannot run, whatever `mutate_check.py` prints, rather than as a `GREEN` gap: no test is backfilled for it and no `unkilled` line is logged from it, and the gap is measured another way or logged `unmeasured`. The decision log's worktree line names the server and what it left unmeasured, and the operating tips now advise stopping a dev server before an unattended drive.
