type: fixed
scope: ultracode-goal
summary: |
  In production, the run now bounds what it hands TEA's NFR assessment, whose Overall Status `gate_eval.py` reads as written. The stage text bounded what the test reviewer is handed and said nothing for `bmad-testarch-nfr`, which takes each threshold and each observation from what it is given, so a delegation could pass it the run's own account of a measurement, a ruling that moved a threshold or an earlier assessment of the same story, and a breach could come back `CONCERNS` or `PASS`, turning a `reloop` into an `advance`. The assessor is now handed the tree it audits, the sources a threshold comes from (the test-design output, the PRD or tech spec, the architecture and its ADRs, the epics file, and the story's acceptance criteria with their thresholds, copied out of the story file), and each file a tool wrote when it measured the commit, or the commit a backfill built on, a failing one included, since an audit handed less reads `CONCERNS`, which does not fail the gate. It is handed nothing else the run wrote, and it is told that nothing it was handed waives a breach, moves a threshold or lifts a status. TEA's NFR audit adds to an assessment already at the path it writes, so before each NFR assessment but a delta gate's re-check, the run now moves the story's earlier `nfr-assessment-<story_id>.md` into the story's `evidence-<story_id>/` folder under a `-cycle-<n>` name, and an earlier `FAIL` no longer stays in the file to hold a fixed story at a re-loop. A delta gate's re-check still reads its own earlier assessment. `gate_eval.py` is unchanged, so a given `nfr-assessment.md` returns the verdict it returned before.
