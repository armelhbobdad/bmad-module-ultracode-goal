type: breaking
scope: ultracode-goal, ucg-formalize
summary: |
  The readiness check can now reach `ready` on an Epic where it flagged judgment candidates, so `/ucg-formalize -H` returns `status=complete`, and a headless run launches, when the judgment pass cleared every flagged candidate. Before, the verdict read `blocked` whenever a candidate was flagged, however the pass judged it, so the preflight hard gate's "`ready` and only `ready`" clause could not be met and `/ucg-formalize` documented `blocked` for that case. Each candidate now carries a line-free `id`; the judgment pass copies that id into the `candidate` field of the red or concern that answers it, and the candidate's `source` into its `source`, and `formalize_check.py --scan <scan object>` counts a candidate answered on that pair as judged (`judged_candidates`) instead of owed. Preflight re-runs the check at the end of step 2 and seeds step 3 from that run, so each seeded line is the line as remediation left it. A candidate the pass confirms is a red and still blocks, a candidate it does not answer still blocks, and a scan the kernel cannot read, or one `red_ids.py` refuses, judges nothing. Each cleared candidate is recorded in the Epic's `.decision-log.md`.
migration: |
  If a pipeline relied on `/ucg-formalize -H` returning `status=blocked`, or on a headless run stopping at preflight, whenever the readiness check flagged a judgment candidate, it can no longer: a candidate the judgment pass clears into `concerns` now lets the Epic through. To review what was cleared, read the cleared candidates, each with its source and the concern's note, from the Epic's `.decision-log.md`. Nothing else changes for a run: a candidate the pass confirms, or does not answer, still blocks it.
