# markdownlint-cli2 configuration
# https://github.com/DavidAnson/markdownlint-cli2

ignores:
  - "**/node_modules/**"
  - test/fixtures/**
  - CODE_OF_CONDUCT.md
  - .github/CODE_OF_CONDUCT.md
  - _bmad/**
  - _bmad*/**
  - .*/**
  - z*/**
  - temp/**
  - build/**
  - graphify-out/**
  # Installed learning scaffolds and agent-skill workspace artifacts
  # (local-only, gitignored), and the generated agent skills (tracked);
  # none of them is authored to this repo's style rules.
  - _ucg-learn/**
  - _skf-learn/**
  - forge-data/**
  - skf-skills/**
  # Skill quality-analysis artifacts and decision logs (local-only, gitignored)
  - skills/**/.analysis/**
  - skills/**/.decision-log.md

# Rule configuration
config:
  # Disable all rules by default
  default: false

  # Heading levels should increment by one (h1 -> h2 -> h3, not h1 -> h3)
  MD001: true

  # Duplicate sibling headings (same heading text at same level under same parent)
  MD024:
    siblings_only: true

  # Trailing commas in headings (likely typos)
  MD026:
    punctuation: ","

  # Bare URLs - may not render as links in all parsers
  # Should use <url> or [text](url) format
  MD034: true

  # Spaces inside emphasis markers - breaks rendering
  # e.g., "* text *" won't render as emphasis
  MD037: true
