name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "website/**"
      - "tools/build-docs.js"
      - ".github/workflows/docs.yaml"
      - "package.json"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "tools/build-docs.js"
      - ".github/workflows/docs.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Held on v5: v6 changes how it stores the git credentials, and release.yaml pushes with them.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build documentation
        env:
          # Override site URL from GitHub repo variable if set
          # Otherwise, astro.config.mjs will compute from GITHUB_REPOSITORY
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    # Build runs on PRs too (catches broken frontmatter / build failures before
    # they reach main); deploy only on a push to main or a manual dispatch there.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
